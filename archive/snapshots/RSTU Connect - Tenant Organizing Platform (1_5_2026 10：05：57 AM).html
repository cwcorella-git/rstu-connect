v></div><div class=&quot;lg:col-span-5 flex items-center justify-center&quot;><div class=&quot;w-32 h-32 bg-rstu-red bg-opacity-10 rounded-full flex items-center justify-center&quot;><svg class=&quot;w-16 h-16 text-rstu-red&quot; fill=none stroke=currentColor viewBox=&quot;0 0 24 24&quot;><path stroke-linecap=round stroke-linejoin=round stroke-width=1.5 d=&quot;M3 12a9 9 0 019-9m0 0a9 9 0 019 9m0 0a9 9 0 01-9 9m0 0a9 9 0 01-9-9m0 0a9 9 0 019-9&quot;></path></svg></div></div></div><div class=&quot;grid grid-cols-1 lg:grid-cols-12 gap-6 items-center&quot;><div class=&quot;lg:col-span-5 flex items-center justify-center order-last lg:order-first&quot;><div class=&quot;w-32 h-32 bg-rstu-red bg-opacity-10 rounded-full flex items-center justify-center&quot;><svg class=&quot;w-16 h-16 text-rstu-red&quot; fill=none stroke=currentColor viewBox=&quot;0 0 24 24&quot;><path stroke-linecap=round stroke-linejoin=round stroke-width=1.5 d=&quot;M13 10V3L4 14h7v7l9-11h-7z&quot;></path></svg></div></div><div class=lg:col-span-7><div class=&quot;bg-gradient-to-br from-red-600 to-rstu-red text-white rounded-xl p-8 sm:p-12 shadow-xl hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2&quot;><p class=&quot;text-2xl sm:text-3xl lg:text-4xl font-black leading-tight&quot;>When landlords own our homes, they own our power.</p></div></div></div><div class=&quot;grid grid-cols-1 lg:grid-cols-12 gap-6 items-center&quot;><div class=lg:col-span-7><div class=&quot;bg-gradient-to-br from-rstu-red to-red-700 text-white rounded-xl p-8 sm:p-12 shadow-xl hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2&quot;><p class=&quot;text-2xl sm:text-3xl lg:text-4xl font-black leading-tight&quot;>We organize to reclaim that power—collectively.</p></div></div><div class=&quot;lg:col-span-5 flex items-center justify-center&quot;><div class=&quot;w-32 h-32 bg-rstu-red bg-opacity-10 rounded-full flex items-center justify-center&quot;><svg class=&quot;w-16 h-16 text-rstu-red&quot; fill=currentColor viewBox=&quot;0 0 24 24&quot;><path d=&quot;M12 2c5.523 0 10 4.477 10 10s-4.477 10-10 10S2 17.523 2 12 6.477 2 12 2m0 2a8 8 0 100 16 8 8 0 000-16m-1 8.5a1.5 1.5 0 110-3 1.5 1.5 0 010 3m-4-3a1.5 1.5 0 110-3 1.5 1.5 0 010 3m8 0a1.5 1.5 0 110-3 1.5 1.5 0 010 3z&quot;></path></svg></div></div></div></div><div class=mb-16><h3 class=&quot;text-2xl sm:text-3xl font-bold text-gray-900 mb-12&quot;>What We Believe</h3><div class=&quot;grid grid-cols-1 md:grid-cols-3 gap-8&quot;><div class=&quot;group relative&quot;><div class=&quot;absolute inset-0 bg-gradient-to-br from-rstu-red to-red-700 opacity-0 group-hover:opacity-5 rounded-xl transition-all duration-300&quot;></div><div class=&quot;relative bg-white border-2 border-gray-200 group-hover:border-rstu-red rounded-xl p-8 transition-all duration-300&quot;><div class=&quot;flex items-center justify-center w-12 h-12 bg-rstu-red bg-opacity-10 rounded-lg mb-4&quot;><svg class=&quot;w-6 h-6 text-rstu-red&quot; fill=currentColor viewBox=&quot;0 0 24 24&quot;><path d=&quot;M13 10V3L4 14h7v7l9-11h-7z&quot;></path></svg></div><h4 class=&quot;text-xl font-bold text-gray-900 mb-3&quot;>Housing is a Human Right</h4><p class=&quot;text-base text-gray-700 leading-relaxed&quot;>Everyone deserves a safe, stable, and comfortable home—no matter their income, background, or circumstance. Housing is not a luxury for the wealthy. It is essential to human dignity.</p></div></div><div class=&quot;group relative&quot;><div class=&quot;absolute inset-0 bg-gradient-to-br from-rstu-red to-red-700 opacity-0 group-hover:opacity-5 rounded-xl transition-all duration-300&quot;></div><div class=&quot;relative bg-white border-2 border-gray-200 group-hover:border-rstu-red rounded-xl p-8 transition-all duration-300&quot;><div class=&quot;flex items-center justify-center w-12 h-12 bg-rstu-red bg-opacity-10 rounded-lg mb-4&quot;><svg class=&quot;w-6 h-6 text-rstu-red&quot; fill=none stroke=currentColor viewBox=&quot;0 0 24 24&quot;><path stroke-linecap=round stroke-linejoin=round stroke-width=2 d=&quot;M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z&quot;></path></svg></div><h4 class=&quot;text-xl font-bold text-gray-900 mb-3&quot;>Landlord &amp;amp; Tenant Interests Are Irreconcilable</h4><p class=&quot;text-base text-gray-700 leading-relaxed&quot;>There is a fundamental conflict: landlords profit from extracting wealth from tenants. Their interests can never align with ours. We cannot negotiate away a system designed to exploit us.</p></div></div><div class=&quot;group relative&quot;><div class=&quot;absolute inset-0 bg-gradient-to-br from-rstu-red to-red-700 opacity-0 group-hover:opacity-5 rounded-xl transition-all duration-300&quot;></div><div class=&quot;relative bg-white border-2 border-gray-200 group-hover:border-rstu-red rounded-xl p-8 transition-all duration-300&quot;><div class=&quot;flex items-center justify-center w-12 h-12 bg-rstu-red bg-opacity-10 rounded-lg mb-4&quot;><svg class=&quot;w-6 h-6 text-rstu-red&quot; fill=currentColor viewBox=&quot;0 0 24 24&quot;><path d=&quot;M12 2c5.523 0 10 4.477 10 10s-4.477 10-10 10S2 17.523 2 12 6.477 2 12 2m0 2a8 8 0 100 16 8 8 0 000-16m-1 8.5a1.5 1.5 0 110-3 1.5 1.5 0 010 3m-4-3a1.5 1.5 0 110-3 1.5 1.5 0 010 3m8 0a1.5 1.5 0 110-3 1.5 1.5 0 010 3z&quot;></path></svg></div><h4 class=&quot;text-xl font-bold text-gray-900 mb-3&quot;>Solidarity is Our Strength</h4><p class=&quot;text-base text-gray-700 leading-relaxed&quot;>An injury to one is an injury to all. Our power comes from standing together—across buildings, neighborhoods, and communities. When we fight collectively, we win.</p></div></div></div></div><div class=&quot;flex items-center gap-4 pt-16 border-t-2 border-gray-200&quot;><div class=&quot;flex-1 h-px bg-gradient-to-r from-gray-200 to-transparent&quot;></div><span class=&quot;text-gray-400 font-bold text-2xl&quot;>★</span><div class=&quot;flex-1 h-px bg-gradient-to-l from-gray-200 to-transparent&quot;></div></div></div></section></div><div id=what-we-do><section class=&quot;py-20 sm:py-28 px-4 bg-gradient-to-b from-gray-50 to-white relative&quot;><div class=&quot;absolute inset-0 overflow-hidden&quot;><div class=&quot;absolute -left-40 top-1/3 w-80 h-80 bg-yellow-200 opacity-5 rounded-full blur-3xl&quot;></div></div><div class=&quot;relative z-10 max-w-6xl mx-auto&quot;><div class=mb-20><h2 class=&quot;text-4xl sm:text-5xl lg:text-6xl font-black text-gray-900 mb-6 leading-tight&quot;>How Tenants Win</h2><div class=&quot;w-20 h-1.5 bg-rstu-red rounded-full mb-8&quot;></div><div class=&quot;max-w-3xl text-lg sm:text-xl text-gray-700 leading-relaxed&quot;><p class=mb-4>Power doesn't come from landlords or politicians—it comes from us, organized collectively. We build tenant power through three interconnected strategies that reinforce each other.<p>These strategies aren't new. They're rooted in decades of tenant movements, labor struggles, and anarchist theory about how ordinary people take control of their own lives. They work because they're designed to shift power from those who profit from housing toward those who need it to survive.</p></div></div><div class=&quot;grid grid-cols-1 lg:grid-cols-3 gap-8 mb-20&quot;><div class=&quot;group relative&quot;><div class=&quot;absolute -inset-1 bg-gradient-to-br from-rstu-red to-red-600 opacity-0 group-hover:opacity-10 rounded-2xl transition-all duration-300 blur&quot;></div><div class=&quot;relative bg-white rounded-2xl p-10 border-2 border-gray-100 group-hover:border-rstu-red transition-all duration-300&quot;><div class=&quot;flex items-center justify-center w-16 h-16 bg-gradient-to-br from-rstu-red to-red-600 text-white rounded-full font-black text-2xl mb-6&quot;>1</div><div class=mb-6><svg class=&quot;w-12 h-12 text-rstu-red&quot; fill=none stroke=currentColor viewBox=&quot;0 0 24 24&quot;><path stroke-linecap=round stroke-linejoin=round stroke-width=1.5 d=&quot;M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5.5m0 0H9m11 0v-7a6 6 0 00-6-6 6 6 0 00-6 6v7m12 0H7&quot;></path></svg></div><h3 class=&quot;text-2xl font-black text-gray-900 mb-3&quot;>Build Tenant Associations</h3><p class=&quot;text-xs text-rstu-red font-bold uppercase tracking-widest mb-4&quot;>Libertarian Municipalism: Direct Democracy from the Ground Up<p class=&quot;text-base text-gray-700 leading-relaxed mb-6&quot;>Start with your building. Organize your neighbors to address maintenance problems, fight unjust evictions, and negotiate with landlords from a position of collective power. Building assemblies aren't just tactics—they're the foundation for democratic decision-making controlled by tenants, not leadership.<div class=&quot;pt-6 border-t-2 border-gray-100&quot;><p class=&quot;text-sm font-bold text-rstu-red&quot;>→ Power flows upward from assemblies, not downward from leaders</p></div></div></div><div class=&quot;group relative lg:translate-y-8&quot;><div class=&quot;absolute -inset-1 bg-gradient-to-br from-rstu-red to-red-600 opacity-0 group-hover:opacity-10 rounded-2xl transition-all duration-300 blur&quot;></div><div class=&quot;relative bg-white rounded-2xl p-10 border-2 border-gray-100 group-hover:border-rstu-red transition-all duration-300&quot;><div class=&quot;flex items-center justify-center w-16 h-16 bg-gradient-to-br from-rstu-red to-red-600 text-white rounded-full font-black text-2xl mb-6&quot;>2</div><div class=mb-6><svg class=&quot;w-12 h-12 text-rstu-red&quot; fill=none stroke=currentColor viewBox=&quot;0 0 24 24&quot;><path stroke-linecap=round stroke-linejoin=round stroke-width=1.5 d=&quot;M17 20h5v-2a3 3 0 00-5.856-1.487M15 10h.01M11 10h.01M7 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z&quot;></path></svg></div><h3 class=&quot;text-2xl font-black text-gray-900 mb-3&quot;>Mutual Aid Networks</h3><p class=&quot;text-xs text-rstu-red font-bold uppercase tracking-widest mb-4&quot;>Kropotkin: Solidarity Over Charity<p class=&quot;text-base text-gray-700 leading-relaxed mb-6&quot;>When landlords retaliate, when rent becomes impossible, when someone loses housing—we support each other. Mutual aid isn't charity; it's solidarity. We share resources, knowledge, and care based on what people need and what we have to give, with no hierarchy and no judgment.<div class=&quot;pt-6 border-t-2 border-gray-100&quot;><p class=&quot;text-sm font-bold text-rstu-red&quot;>→ An injury to one is an injury to all</p></div></div></div><div class=&quot;group relative&quot;><div class=&quot;absolute -inset-1 bg-gradient-to-br from-rstu-red to-red-600 opacity-0 group-hover:opacity-10 rounded-2xl transition-all duration-300 blur&quot;></div><div class=&quot;relative bg-white rounded-2xl p-10 border-2 border-gray-100 group-hover:border-rstu-red transition-all duration-300&quot;><div class=&quot;flex items-center justify-center w-16 h-16 bg-gradient-to-br from-rstu-red to-red-600 text-white rounded-full font-black text-2xl mb-6&quot;>3</div><div class=mb-6><svg class=&quot;w-12 h-12 text-rstu-red&quot; fill=none stroke=currentColor viewBox=&quot;0 0 24 24&quot;><path stroke-linecap=round stroke-linejoin=round stroke-width=1.5 d=&quot;M12 19l9 2-9-18-9 18 9-2m0 0v-8m0 8l-6-4m6 4l6-4&quot;></path></svg></div><h3 class=&quot;text-2xl font-black text-gray-900 mb-3&quot;>Direct Action &amp;amp; Campaigns</h3><p class=&quot;text-xs text-rstu-red font-bold uppercase tracking-widest mb-4&quot;>Class Struggle: Confronting Power Where It Is<p class=&quot;text-base text-gray-700 leading-relaxed mb-6&quot;>We demand change through organized action: eviction defense, rent strikes, city council pressure, and campaigns that make landlords and politicians feel our collective power. Landlords won't voluntarily give up profit—we have to take it back through confrontation and coordinated action.<div class=&quot;pt-6 border-t-2 border-gray-100&quot;><p class=&quot;text-sm font-bold text-rstu-red&quot;>→ Without struggle, there is no change</p></div></div></div></div><div class=&quot;bg-gradient-to-br from-rstu-red to-red-700 text-white rounded-2xl p-12 shadow-xl&quot;><h3 class=&quot;text-2xl sm:text-3xl font-black mb-8&quot;>These three strategies embody a coherent philosophy of power.</h3><ul class=&quot;grid grid-cols-1 md:grid-cols-3 gap-8&quot;><li class=&quot;flex gap-4&quot;><span class=&quot;flex-shrink-0 text-2xl&quot;>■</span><span class=&quot;text-lg leading-relaxed&quot;>Municipalism: Building democratic power through tenant assemblies, bottom-up decision-making, and confederation between groups</span><li class=&quot;flex gap-4&quot;><span class=&quot;flex-shrink-0 text-2xl&quot;>■</span><span class=&quot;text-lg leading-relaxed&quot;>Mutual Aid: Building solidarity by meeting each other's needs collectively, outside of capitalist hierarchies</span><li class=&quot;flex gap-4&quot;><span class=&quot;flex-shrink-0 text-2xl&quot;>■</span><span class=&quot;text-lg leading-relaxed&quot;>Dual Power: Resisting landlord exploitation AND building alternative structures that prove we can run housing ourselves</span></ul></div><div class=&quot;mt-20 flex items-center gap-4&quot;><div class=&quot;flex-1 h-px bg-gradient-to-r from-gray-300 to-transparent&quot;></div><span class=&quot;text-gray-400 font-bold text-2xl&quot;>◆</span><div class=&quot;flex-1 h-px bg-gradient-to-l from-gray-300 to-transparent&quot;></div></div></div></section></div><div id=values><section class=&quot;py-20 sm:py-28 px-4 bg-white relative overflow-hidden&quot;><div class=&quot;absolute inset-0 overflow-hidden&quot;><div class=&quot;absolute bottom-0 right-0 w-96 h-96 bg-yellow-300 opacity-3 rounded-full blur-3xl&quot;></div></div><div class=&quot;relative z-10 max-w-5xl mx-auto&quot;><div class=mb-20><h2 class=&quot;text-4xl sm:text-5xl lg:text-6xl font-black text-gray-900 mb-4 leading-tight&quot;>What We Believe</h2><div class=&quot;w-24 h-1 bg-rstu-red rounded-full mb-8&quot;></div><p class=&quot;text-xl sm:text-2xl text-gray-700 leading-relaxed max-w-3xl&quot;>Five truths about housing injustice that demand action</p></div><div class=space-y-8><div class=&quot;group relative transform transition-all duration-300 lg:translate-x-0&quot;><div class=&quot;absolute -inset-1 bg-gradient-to-r from-rstu-red via-red-600 to-rstu-red opacity-0 group-hover:opacity-5 rounded-2xl transition-all duration-300 blur-xl&quot;></div><div class=&quot;relative bg-white rounded-2xl border-2 border-gray-100 group-hover:border-rstu-red p-8 sm:p-12 transition-all duration-300 overflow-hidden&quot;><div class=&quot;absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-rstu-red via-red-600 to-transparent opacity-60&quot;></div><div class=&quot;flex flex-col sm:flex-row gap-8 items-start&quot;><div class=flex-shrink-0><div class=&quot;flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-rstu-red to-red-700 text-white font-black text-3xl shadow-lg&quot;>1</div></div><div class=flex-grow><h3 class=&quot;text-2xl sm:text-3xl font-black text-gray-900 mb-4 leading-tight&quot;>Rent is Extracted Labor</h3><p class=&quot;text-lg text-gray-700 leading-relaxed&quot;>Every month you work to pay rent someone else didn't earn. Landlords profit from what you produce—your labor. Housing extraction is a form of wage theft. Until we control housing collectively, landlords control your labor.</p></div></div></div></div><div class=&quot;group relative transform transition-all duration-300 lg:translate-x-0&quot;><div class=&quot;absolute -inset-1 bg-gradient-to-r from-rstu-red via-red-600 to-rstu-red opacity-0 group-hover:opacity-5 rounded-2xl transition-all duration-300 blur-xl&quot;></div><div class=&quot;relative bg-white rounded-2xl border-2 border-gray-100 group-hover:border-rstu-red p-8 sm:p-12 transition-all duration-300 overflow-hidden&quot;><div class=&quot;absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-rstu-red via-red-600 to-transparent opacity-60&quot;></div><div class=&quot;flex flex-col sm:flex-row gap-8 items-start&quot;><div class=flex-shrink-0><div class=&quot;flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-rstu-red to-red-700 text-white font-black text-3xl shadow-lg&quot;>2</div></div><div class=flex-grow><h3 class=&quot;text-2xl sm:text-3xl font-black text-gray-900 mb-4 leading-tight&quot;>Housing Injustice is Systemic, Not Personal</h3><p class=&quot;text-lg text-gray-700 leading-relaxed&quot;>Housing inequality isn't caused by individual bad landlords. It's built into a system where property is treated as investment, not need. Until we change the system itself, individuals will always exploit it. We fight the system, not landlords.</p></div></div></div></div><div class=&quot;group relative transform transition-all duration-300 lg:translate-x-0&quot;><div class=&quot;absolute -inset-1 bg-gradient-to-r from-rstu-red via-red-600 to-rstu-red opacity-0 group-hover:opacity-5 rounded-2xl transition-all duration-300 blur-xl&quot;></div><div class=&quot;relative bg-white rounded-2xl border-2 border-gray-100 group-hover:border-rstu-red p-8 sm:p-12 transition-all duration-300 overflow-hidden&quot;><div class=&quot;absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-rstu-red via-red-600 to-transparent opacity-60&quot;></div><div class=&quot;flex flex-col sm:flex-row gap-8 items-start&quot;><div class=flex-shrink-0><div class=&quot;flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-rstu-red to-red-700 text-white font-black text-3xl shadow-lg&quot;>3</div></div><div class=flex-grow><h3 class=&quot;text-2xl sm:text-3xl font-black text-gray-900 mb-4 leading-tight&quot;>Systemic Racism Built Housing Apartheid</h3><p class=&quot;text-lg text-gray-700 leading-relaxed&quot;>Housing segregation, redlining, and discriminatory lending were deliberate policies. They created the racial wealth gap that persists today. Housing is inseparable from race in America. Housing justice is racial justice.</p></div></div></div></div><div class=&quot;group relative transform transition-all duration-300 lg:translate-x-0&quot;><div class=&quot;absolute -inset-1 bg-gradient-to-r from-rstu-red via-red-600 to-rstu-red opacity-0 group-hover:opacity-5 rounded-2xl transition-all duration-300 blur-xl&quot;></div><div class=&quot;relative bg-white rounded-2xl border-2 border-gray-100 group-hover:border-rstu-red p-8 sm:p-12 transition-all duration-300 overflow-hidden&quot;><div class=&quot;absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-rstu-red via-red-600 to-transparent opacity-60&quot;></div><div class=&quot;flex flex-col sm:flex-row gap-8 items-start&quot;><div class=flex-shrink-0><div class=&quot;flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-rstu-red to-red-700 text-white font-black text-3xl shadow-lg&quot;>4</div></div><div class=flex-grow><h3 class=&quot;text-2xl sm:text-3xl font-black text-gray-900 mb-4 leading-tight&quot;>Financialization Kills Communities</h3><p class=&quot;text-lg text-gray-700 leading-relaxed&quot;>Wall Street buys up housing. Hedge funds and corporate landlords treat homes as profit centers, not shelter. They extract maximum wealth from communities. We fight to decommodify housing and remove it from the speculative market.</p></div></div></div></div><div class=&quot;group relative transform transition-all duration-300 lg:translate-x-0&quot;><div class=&quot;absolute -inset-1 bg-gradient-to-r from-rstu-red via-red-600 to-rstu-red opacity-0 group-hover:opacity-5 rounded-2xl transition-all duration-300 blur-xl&quot;></div><div class=&quot;relative bg-white rounded-2xl border-2 border-gray-100 group-hover:border-rstu-red p-8 sm:p-12 transition-all duration-300 overflow-hidden&quot;><div class=&quot;absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-rstu-red via-red-600 to-transparent opacity-60&quot;></div><div class=&quot;flex flex-col sm:flex-row gap-8 items-start&quot;><div class=flex-shrink-0><div class=&quot;flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-rstu-red to-red-700 text-white font-black text-3xl shadow-lg&quot;>5</div></div><div class=flex-grow><h3 class=&quot;text-2xl sm:text-3xl font-black text-gray-900 mb-4 leading-tight&quot;>Collective Power is Our Only Leverage</h3><p class=&quot;text-lg text-gray-700 leading-relaxed&quot;>Alone, we're powerless against corporate capital. Together, we can refuse extraction. When we organize as a bloc—building by building, neighborhood by neighborhood—we become the decision-makers. Collective control of housing is the only path to liberation.</p></div></div></div></div></div><div class=&quot;mt-20 pt-16 border-t-2 border-gray-200 flex items-center gap-4&quot;><div class=&quot;flex-1 h-px bg-gradient-to-r from-gray-300 to-transparent&quot;></div><span class=&quot;text-gray-400 font-bold text-2xl&quot;>◆</span><div class=&quot;flex-1 h-px bg-gradient-to-l from-gray-300 to-transparent&quot;></div></div></div></section></div><div id=philosophy-pillars><section class=&quot;py-16 sm:py-20 px-4 bg-white&quot;><div class=&quot;max-w-6xl mx-auto&quot;><div class=&quot;max-w-3xl mx-auto mb-16&quot;><h2 class=&quot;text-4xl sm:text-5xl font-bold text-gray-900 mb-6&quot;>Our Organizing Philosophy</h2><p class=&quot;text-lg text-gray-700 leading-relaxed mb-4&quot;>We don't just fight to win concessions from landlords. We fight to build a different kind of power—collective, democratic, and rooted in solidarity. Our philosophy rests on three pillars that work together to transform how we live, relate to each other, and understand what's possible.<p class=&quot;text-base text-gray-600 italic&quot;>These are not separate strategies but interconnected principles that reinforce each other.</p></div><div class=&quot;grid grid-cols-1 md:grid-cols-3 gap-8 mb-16&quot;><div class=&quot;bg-white rounded-lg p-8 border border-gray-200 hover:border-rstu-red hover:shadow-lg transition-all duration-200&quot;><div class=mb-6><h3 class=&quot;text-2xl font-bold text-gray-900 mb-2&quot;>Libertarian Municipalism</h3><p class=&quot;text-sm text-gray-600 font-medium&quot;>— Murray Bookchin</p></div><div class=&quot;bg-red-50 border-l-4 border-rstu-red p-4 mb-6&quot;><p class=&quot;text-sm italic text-gray-700&quot;>&quot;Power cannot be used to abolish hierarchy; it can only reinforce it. We need confederal structures where power flows upward from assemblies of ordinary people, not from the top down.&quot;</p></div><p class=&quot;text-base text-gray-700 leading-relaxed mb-6&quot;>Democracy is not a distant vote for distant politicians. It is tenants in a building deciding together how to live. Libertarian municipalism starts with neighborhood and building assemblies where ordinary people deliberate, decide, and act directly on the issues affecting their lives. These assemblies then confederate—linking together without centralizing authority—creating networks of power that remain accountable to those they represent. This is how we overcome the separation between rulers and ruled, and how we build power from the ground up.<div class=space-y-3><p class=&quot;text-xs font-semibold text-gray-500 uppercase&quot;>Core Concepts:<ul class=space-y-2><li class=&quot;flex gap-3 text-sm text-gray-700&quot;><span class=&quot;text-rstu-red font-bold flex-shrink-0&quot;>•</span><span>Direct democracy: assemblies where tenants make decisions together</span><li class=&quot;flex gap-3 text-sm text-gray-700&quot;><span class=&quot;text-rstu-red font-bold flex-shrink-0&quot;>•</span><span>Confederation: networks of equal groups, not hierarchies</span><li class=&quot;flex gap-3 text-sm text-gray-700&quot;><span class=&quot;text-rstu-red font-bold flex-shrink-0&quot;>•</span><span>Accountability: representatives answerable to assemblies</span><li class=&quot;flex gap-3 text-sm text-gray-700&quot;><span class=&quot;text-rstu-red font-bold flex-shrink-0&quot;>•</span><span>Localism with solidarity: decisions at the neighborhood level, coordinated across communities</span></ul></div></div><div class=&quot;bg-white rounded-lg p-8 border border-gray-200 hover:border-rstu-red hover:shadow-lg transition-all duration-200&quot;><div class=mb-6><h3 class=&quot;text-2xl font-bold text-gray-900 mb-2&quot;>Mutual Aid</h3><p class=&quot;text-sm text-gray-600 font-medium&quot;>— Peter Kropotkin</p></div><div class=&quot;bg-red-50 border-l-4 border-rstu-red p-4 mb-6&quot;><p class=&quot;text-sm italic text-gray-700&quot;>&quot;Mutual aid is the tendency of all living organisms to help each other. Cooperation, not competition, is the natural state of survival.&quot;</p></div><p class=&quot;text-base text-gray-700 leading-relaxed mb-6&quot;>The capitalist myth says we compete as isolated individuals fighting for survival. Mutual aid tells the truth: humans survive and flourish through cooperation. When a tenant faces eviction, their neighbors organize a defense. When rent becomes impossible, we pool resources. When the state fails the unhoused, we build shelter together. Mutual aid is not charity—it has no hierarchy of giver and receiver. It is solidarity: the reciprocal understanding that we survive together or not at all. It is how we meet each other's needs outside and against capitalist markets, building the relations of care that will sustain us in the liberated world we're building.<div class=space-y-3><p class=&quot;text-xs font-semibold text-gray-500 uppercase&quot;>Core Concepts:<ul class=space-y-2><li class=&quot;flex gap-3 text-sm text-gray-700&quot;><span class=&quot;text-rstu-red font-bold flex-shrink-0&quot;>•</span><span>Solidarity as principle: an injury to one is an injury to all</span><li class=&quot;flex gap-3 text-sm text-gray-700&quot;><span class=&quot;text-rstu-red font-bold flex-shrink-0&quot;>•</span><span>Reciprocity, not hierarchy: we all give and receive</span><li class=&quot;flex gap-3 text-sm text-gray-700&quot;><span class=&quot;text-rstu-red font-bold flex-shrink-0&quot;>•</span><span>Collective care: meeting needs through mutual support</span><li class=&quot;flex gap-3 text-sm text-gray-700&quot;><span class=&quot;text-rstu-red font-bold flex-shrink-0&quot;>•</span><span>Alternative to markets: resources distributed by need, not profit</span></ul></div></div><div class=&quot;bg-white rounded-lg p-8 border border-gray-200 hover:border-rstu-red hover:shadow-lg transition-all duration-200&quot;><div class=mb-6><h3 class=&quot;text-2xl font-bold text-gray-900 mb-2&quot;>Dual Power</h3><p class=&quot;text-sm text-gray-600 font-medium&quot;>— Tenants' Rights Organizers</p></div><div class=&quot;bg-red-50 border-l-4 border-rstu-red p-4 mb-6&quot;><p class=&quot;text-sm italic text-gray-700&quot;>&quot;We do not win by asking the landlord to be kind. We win by making our collective power so undeniable that the landlord has no choice but to concede. And as we win, we build the institutions of a world without landlords.&quot;</p></div><p class=&quot;text-base text-gray-700 leading-relaxed mb-6&quot;>Dual power means fighting on two fronts simultaneously. First, we confront the power of landlords and the state with organized action: rent strikes, eviction defense, political pressure. We make collective power visible and irresistible. But confrontation alone cannot build the world we need. So second, we build alternative structures that prove another way is possible: tenant assemblies that govern democratically, mutual aid networks that meet needs collectively, cooperative housing that provides shelter without extraction. As we fight the old world, we construct the new world within it. Neither confrontation nor construction alone is enough—together they form a strategy that weakens landlord control while strengthening tenant power and prefiguring the liberated world we seek.<div class=space-y-3><p class=&quot;text-xs font-semibold text-gray-500 uppercase&quot;>Core Concepts:<ul class=space-y-2><li class=&quot;flex gap-3 text-sm text-gray-700&quot;><span class=&quot;text-rstu-red font-bold flex-shrink-0&quot;>•</span><span>Resistance: confronting landlord power through organized struggle</span><li class=&quot;flex gap-3 text-sm text-gray-700&quot;><span class=&quot;text-rstu-red font-bold flex-shrink-0&quot;>•</span><span>Construction: building democratic and cooperative alternatives</span><li class=&quot;flex gap-3 text-sm text-gray-700&quot;><span class=&quot;text-rstu-red font-bold flex-shrink-0&quot;>•</span><span>Prefiguration: the means we use shape the world we create</span><li class=&quot;flex gap-3 text-sm text-gray-700&quot;><span class=&quot;text-rstu-red font-bold flex-shrink-0&quot;>•</span><span>Integration: resistance and construction reinforce each other</span></ul></div></div></div><div class=&quot;bg-red-50 border border-red-200 rounded-lg p-8 max-w-4xl mx-auto mb-8&quot;><h3 class=&quot;text-2xl font-bold text-gray-900 mb-4&quot;>Three Pillars, One Power</h3><div class=&quot;space-y-4 text-base text-gray-700&quot;><p>These three pillars are not separate—they work together. Municipalism gives us the democratic form: how we decide together. Mutual aid gives us the social content: how we care for each other. Dual power gives us the strategy: how we confront landlord power while building alternatives.<p>When we build tenant associations, we're practicing municipalism—creating assemblies where ordinary tenants make decisions that affect their lives. When we organize mutual aid networks, we're proving that we can meet each other's needs without landlord profiteers. When we wage direct action campaigns, we're exercising dual power—resisting exploitation while building the tenant power structures that will sustain us in a liberated future.<p>This is how we move from complaint to power, from survival to liberation. Not by accepting the world as it is, but by actively constructing the world as it should be.</p></div></div><div class=&quot;mt-12 flex items-center gap-4&quot;><div class=&quot;flex-1 h-px bg-gray-200&quot;></div><span class=&quot;text-gray-400 font-semibold&quot;>≈</span><div class=&quot;flex-1 h-px bg-gray-200&quot;></div></div></div></section></div><div id=readings><section class=&quot;py-16 sm:py-20 px-4 bg-gray-50&quot;><div class=&quot;max-w-6xl mx-auto&quot;><div class=&quot;text-center mb-12&quot;><h2 class=&quot;text-4xl sm:text-5xl font-bold text-gray-900 mb-4&quot;>Start Here: Essential Reading</h2><p class=&quot;text-lg text-gray-600&quot;>Dive into RSTU's library of 900+ organizing resources</p></div><div class=&quot;text-center py-12&quot;><p class=text-gray-500>Loading featured documents...</p></div><div class=&quot;mt-12 bg-gradient-to-r from-rstu-red to-red-700 rounded-lg p-8 text-white text-center&quot;><h3 class=&quot;text-2xl font-bold mb-3&quot;>Explore the Full Library</h3><p class=&quot;mb-6 max-w-2xl mx-auto&quot;>These are just a few highlights. Dive into our complete reading library with 900+ documents on organizing, theory, housing justice, labor history, and mutual aid.</p><button class=&quot;inline-block px-8 py-3 bg-white text-rstu-red font-semibold rounded-lg hover:bg-gray-100 transition-colors&quot;>Browse Full Library →</button></div><div class=&quot;mt-12 flex items-center gap-4&quot;><div class=&quot;flex-1 h-px bg-gray-300&quot;></div><span class=&quot;text-gray-400 font-semibold&quot;>≈</span><div class=&quot;flex-1 h-px bg-gray-300&quot;></div></div></div></section></div><div id=cta><section class=&quot;relative py-24 sm:py-32 px-4 bg-gradient-to-br from-gray-900 via-rstu-red to-gray-800 overflow-hidden&quot;><div class=&quot;absolute inset-0 overflow-hidden&quot;><div class=&quot;absolute top-1/2 right-0 w-96 h-96 bg-rstu-red opacity-5 rounded-full blur-3xl&quot;></div><div class=&quot;absolute -bottom-20 -left-20 w-80 h-80 bg-yellow-300 opacity-10 rounded-full blur-3xl&quot;></div></div><div class=&quot;relative z-10 max-w-5xl mx-auto text-center&qu
