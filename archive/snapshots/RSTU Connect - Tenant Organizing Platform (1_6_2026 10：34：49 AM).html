<h2 class=&quot;text-4xl sm:text-5xl lg:text-5xl font-bold text-gray-900 mb-6 leading-tight&quot;>Facing Rent Increases? Eviction? Repairs Ignored?</h2><p class=&quot;text-xl sm:text-2xl text-rstu-red font-semibold mb-6&quot;>Your rights are real and enforceable. When tenants organize together, they win.<p class=&quot;text-base sm:text-lg text-gray-700 max-w-2xl mx-auto mb-10 leading-relaxed&quot;>We organize tenants in Reno-Sparks and Washoe County to fight for housing justice. We believe in collective power, solidarity, and the radical idea that housing should be a right, not a commodity.<div class=&quot;flex flex-col sm:flex-row gap-4 justify-center mb-12&quot;><button class=&quot;px-8 py-3 bg-rstu-red text-white font-semibold rounded-lg hover:bg-red-700 transition-colors text-center&quot;>Enter RSTU Connect</button><button class=&quot;px-8 py-3 border-2 border-gray-300 text-gray-700 font-semibold rounded-lg hover:border-rstu-red hover:text-rstu-red transition-colors text-center&quot;>Learn More</button></div><div class=&quot;flex justify-center animate-pulse&quot;><button class=&quot;text-gray-400 hover:text-gray-600 transition-colors&quot; aria-label=&quot;Scroll to next section&quot;><svg class=&quot;w-6 h-6&quot; fill=none stroke=currentColor viewBox=&quot;0 0 24 24&quot;><path stroke-linecap=round stroke-linejoin=round stroke-width=2 d=&quot;M19 14l-7 7m0 0l-7-7m7 7V3&quot;></path></svg></button></div></div><div class=&quot;absolute bottom-0 left-0 right-0 h-px bg-gradient-to-r from-transparent via-gray-300 to-transparent&quot;></div></section></div><div id=rights><section class=&quot;py-16 sm:py-20 px-4 bg-gray-50&quot;><div class=&quot;max-w-4xl mx-auto&quot;><h2 class=&quot;text-3xl sm:text-4xl font-bold text-gray-900 mb-4 text-center&quot;>Your Rights as a Nevada Tenant</h2><p class=&quot;text-center text-gray-700 mb-12 max-w-2xl mx-auto&quot;>Nevada law (NRS 118A) gives you concrete, enforceable rights. Here's what landlords must do.<div class=&quot;grid grid-cols-1 md:grid-cols-2 gap-8 mb-12&quot;><div class=&quot;bg-white p-6 rounded-lg border border-gray-200&quot;><h3 class=&quot;text-xl font-bold text-rstu-red mb-3&quot;>The Right to Habitable Housing</h3><ul class=&quot;space-y-2 text-gray-700 text-sm&quot;><li class=&quot;flex items-start&quot;><span class=&quot;text-rstu-red mr-3 mt-1&quot;>•</span><span>Effective weatherproofing of roof, walls, windows, and doors</span><li class=&quot;flex items-start&quot;><span class=&quot;text-rstu-red mr-3 mt-1&quot;>•</span><span>Functioning plumbing with hot and cold running water</span><li class=&quot;flex items-start&quot;><span class=&quot;text-rstu-red mr-3 mt-1&quot;>•</span><span>Adequate heating and electrical systems in working order</span><li class=&quot;flex items-start&quot;><span class=&quot;text-rstu-red mr-3 mt-1&quot;>•</span><span>Pest control keeping the building reasonably free from rodents and insects</span><li class=&quot;flex items-start&quot;><span class=&quot;text-rstu-red mr-3 mt-1&quot;>•</span><span>Structural integrity with floors, walls, ceilings, and stairways in good repair</span></ul><p class=&quot;text-xs text-gray-500 mt-4 italic&quot;>NRS 118A.290 - Implied Warranty of Habitability</p></div><div class=&quot;bg-white p-6 rounded-lg border border-gray-200&quot;><h3 class=&quot;text-xl font-bold text-rstu-red mb-3&quot;>Protection Against Retaliation</h3><p class=&quot;text-gray-700 text-sm mb-4&quot;>Landlords cannot punish you for exercising your legal rights. It is illegal for them to retaliate against you for:<ul class=&quot;space-y-2 text-gray-700 text-sm&quot;><li class=&quot;flex items-start&quot;><span class=&quot;text-rstu-red mr-3 mt-1&quot;>•</span><span>Organizing or joining a tenant union</span><li class=&quot;flex items-start&quot;><span class=&quot;text-rstu-red mr-3 mt-1&quot;>•</span><span>Reporting code violations to government agencies</span><li class=&quot;flex items-start&quot;><span class=&quot;text-rstu-red mr-3 mt-1&quot;>•</span><span>Filing habitability-related lawsuits or complaints</span></ul><p class=&quot;text-xs text-gray-500 mt-4 italic&quot;>NRS 118A.510 - Anti-Retaliation Protection. Violators can be forced to pay $2,500 in punitive damages plus actual damages.</p></div></div><div class=&quot;bg-white p-8 rounded-lg border border-gray-200&quot;><h3 class=&quot;text-xl font-bold text-rstu-red mb-4&quot;>Your Remedies When Landlords Fail</h3><p class=&quot;text-gray-700 mb-6&quot;>If your landlord violates the habitability warranty, you have legal remedies:<div class=&quot;grid grid-cols-1 md:grid-cols-2 gap-6&quot;><div><h4 class=&quot;font-semibold text-gray-900 mb-2&quot;>For Essential Services (heat, water, electricity, locks)</h4><p class=&quot;text-gray-700 text-sm&quot;>Give written notice, wait 48 hours (excluding weekends), then you may obtain the service yourself and deduct actual costs from rent, or withhold rent until repairs are made.</p></div><div><h4 class=&quot;font-semibold text-gray-900 mb-2&quot;>For Other Habitability Issues (pests, structural damage)</h4><p class=&quot;text-gray-700 text-sm&quot;>Give written notice, wait 14 days for landlord to fix or make best efforts, then you may terminate the lease, withhold rent without late fees, or for repairs under $100, repair and deduct.</p></div></div><div class=&quot;mt-6 p-4 bg-amber-50 border border-amber-200 rounded&quot;><p class=&quot;text-sm text-amber-900&quot;><span class=font-semibold>⚠️ Important for Rent Withholding:</span> Nevada courts require you to deposit withheld rent in court escrow to use habitability as an eviction defense. Without this, you risk losing your case.</p></div></div></div></section></div><div id=organizing><section class=&quot;py-16 sm:py-20 px-4 bg-white&quot;><div class=&quot;max-w-4xl mx-auto&quot;><h2 class=&quot;text-3xl sm:text-4xl font-bold text-gray-900 mb-4 text-center&quot;>Organizing Works—Here's the Proof</h2><p class=&quot;text-center text-gray-700 mb-12 max-w-2xl mx-auto&quot;>Across the country, tenants who organize together win concrete improvements. These aren't isolated incidents but part of a growing national movement.<div class=&quot;grid grid-cols-1 md:grid-cols-2 gap-6 mb-8&quot;><div class=&quot;border-l-4 border-rstu-red p-6 bg-gray-50 rounded&quot;><h3 class=&quot;text-2xl font-bold text-gray-900 mb-2&quot;>KC Tenants Strike</h3><p class=&quot;text-sm text-rstu-red font-semibold mb-3&quot;>248 days on strike. $300,000 in back rent forgiven.<ul class=&quot;space-y-2 text-gray-700 text-sm&quot;><li class=&quot;flex items-start&quot;><span class=&quot;text-rstu-red mr-2&quot;>✓</span><span>Rent freeze for all current tenants (second year capped at 5%)</span><li class=&quot;flex items-start&quot;><span class=&quot;text-rstu-red mr-2&quot;>✓</span><span>Nearly $300,000 in withheld rent forgiven—$0 back rent owed</span><li class=&quot;flex items-start&quot;><span class=&quot;text-rstu-red mr-2&quot;>✓</span><span>Formal union recognition with annual renegotiation rights</span><li class=&quot;flex items-start&quot;><span class=&quot;text-rstu-red mr-2&quot;>✓</span><span>Anti-retaliation protections written into agreement, late fee reform, comprehensive repair guarantees</span></ul></div><div class=&quot;border-l-4 border-rstu-red p-6 bg-gray-50 rounded&quot;><h3 class=&quot;text-2xl font-bold text-gray-900 mb-2&quot;>New York Good Cause Eviction</h3><p class=&quot;text-sm text-rstu-red font-semibold mb-3&quot;>~1 million renters protected<p class=&quot;text-gray-700 text-sm mb-3&quot;>After five years of sustained organizing, New York passed statewide protections in 2024.<ul class=&quot;space-y-2 text-gray-700 text-sm&quot;><li class=&quot;flex items-start&quot;><span class=&quot;text-rstu-red mr-2&quot;>✓</span><span>Caps presumptively unreasonable rent increases at 5% + CPI (or 10%, whichever is lower)</span><li class=&quot;flex items-start&quot;><span class=&quot;text-rstu-red mr-2&quot;>✓</span><span>Requires landlords to have good cause to evict or refuse lease renewal</span></ul></div><div class=&quot;border-l-4 border-rstu-red p-6 bg-gray-50 rounded&quot;><h3 class=&quot;text-2xl font-bold text-gray-900 mb-2&quot;>California AB 1482</h3><p class=&quot;text-sm text-rstu-red font-semibold mb-3&quot;>~8 million renters gained protection<p class=&quot;text-gray-700 text-sm mb-3&quot;>California's Tenant Protection Act (2019) became a model for tenant protections nationwide.<ul class=&quot;space-y-2 text-gray-700 text-sm&quot;><li class=&quot;flex items-start&quot;><span class=&quot;text-rstu-red mr-2&quot;>✓</span><span>Statewide rent increase limits of 5% + local CPI (or 10% max)</span><li class=&quot;flex items-start&quot;><span class=&quot;text-rstu-red mr-2&quot;>✓</span><span>Just cause eviction requirements after 12 months + one month's relocation assistance</span></ul></div><div class=&quot;border-l-4 border-rstu-red p-6 bg-gray-50 rounded&quot;><h3 class=&quot;text-2xl font-bold text-gray-900 mb-2&quot;>Oregon SB 608</h3><p class=&quot;text-sm text-rstu-red font-semibold mb-3&quot;>First statewide rent control in the nation<p class=&quot;text-gray-700 text-sm mb-3&quot;>Oregon became the first state to pass statewide rent control (2019).<ul class=&quot;space-y-2 text-gray-700 text-sm&quot;><li class=&quot;flex items-start&quot;><span class=&quot;text-rstu-red mr-2&quot;>✓</span><span>Annual rent increase cap of 7% + CPI</span><li class=&quot;flex items-start&quot;><span class=&quot;text-rstu-red mr-2&quot;>✓</span><span>Just cause eviction protections after 12 months</span></ul></div></div><div class=&quot;bg-rstu-red text-white p-8 rounded-lg text-center&quot;><p class=&quot;text-lg sm:text-xl&quot;>Individual complaints get ignored. Collective action gets results. These victories prove it.</p></div></div></section></div><div id=crisis><section class=&quot;py-16 sm:py-20 px-4 bg-gray-50&quot;><div class=&quot;max-w-4xl mx-auto&quot;><h2 class=&quot;text-3xl sm:text-4xl font-bold text-gray-900 mb-4 text-center&quot;>The Housing Crisis in Reno-Sparks</h2><p class=&quot;text-center text-gray-700 mb-12 max-w-2xl mx-auto&quot;>These aren't abstract problems—they're the conditions tenants in Washoe County face every month.<div class=&quot;grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 mb-8&quot;><div class=&quot;bg-white p-6 rounded-lg border border-gray-200 text-center&quot;><p class=&quot;text-4xl sm:text-5xl font-bold text-rstu-red mb-2&quot;>40-45%<p class=&quot;text-sm text-gray-700&quot;>Rent increase since 2019</p></div><div class=&quot;bg-white p-6 rounded-lg border border-gray-200 text-center&quot;><p class=&quot;text-4xl sm:text-5xl font-bold text-rstu-red mb-2&quot;>57%<p class=&quot;text-sm text-gray-700&quot;>Cost-burdened renters (pay 30%+ of income on housing)</p></div><div class=&quot;bg-white p-6 rounded-lg border border-gray-200 text-center&quot;><p class=&quot;text-4xl sm:text-5xl font-bold text-rstu-red mb-2&quot;>82 hrs<p class=&quot;text-sm text-gray-700&quot;>Minimum wage hours per week needed to afford a 1-bedroom</p></div><div class=&quot;bg-white p-6 rounded-lg border border-gray-200 text-center&quot;><p class=&quot;text-4xl sm:text-5xl font-bold text-rstu-red mb-2&quot;>1,760<p class=&quot;text-sm text-gray-700&quot;>Homeless people in Washoe County (2024)</p></div><div class=&quot;bg-white p-6 rounded-lg border border-gray-200 text-center&quot;><p class=&quot;text-4xl sm:text-5xl font-bold text-rstu-red mb-2&quot;>296<p class=&quot;text-sm text-gray-700&quot;>Evictions filed per day (statewide)</p></div><div class=&quot;bg-white p-6 rounded-lg border border-gray-200 text-center&quot;><p class=&quot;text-4xl sm:text-5xl font-bold text-rstu-red mb-2&quot;>94%<p class=&quot;text-sm text-gray-700&quot;>Of apartments built in Reno (last decade) are luxury units</p></div></div><div class=&quot;bg-white p-8 rounded-lg border-2 border-rstu-red&quot;><p class=&quot;text-lg text-gray-900 leading-relaxed&quot;>Rents are up 40-45% in five years. More than half of renters are cost-burdened. A minimum wage worker needs to work 82 hours per week to afford a one-bedroom apartment. Nevada has the fastest eviction process in the nation. Meanwhile, luxury apartments sit empty while 1,760 people have nowhere to sleep.</p></div><div class=&quot;mt-8 p-6 bg-amber-50 rounded-lg border border-amber-200&quot;><h3 class=&quot;text-lg font-bold text-gray-900 mb-3&quot;>Support Exists If You Need It</h3><p class=&quot;text-gray-700 mb-3&quot;>You're not alone. Legal aid, emergency assistance, and organizing support are available:<ul class=&quot;space-y-2 text-gray-700 text-sm&quot;><li>• <strong>Free legal help for eviction defense and habitability issues</strong><li>• <strong>Emergency rental assistance and eviction diversion programs</strong><li>• <strong>Tenant advocacy organizations fighting for policy change</strong></ul></div></div></section></div><div id=action><section class=&quot;py-16 sm:py-20 px-4 bg-white&quot;><div class=&quot;max-w-4xl mx-auto&quot;><h2 class=&quot;text-3xl sm:text-4xl font-bold text-gray-900 mb-4 text-center&quot;>What You Can Do Right Now</h2><p class=&quot;text-center text-gray-700 mb-12 max-w-2xl mx-auto&quot;>Whether you're facing an eviction, a repair issue, or just want to get involved, here's where to start.<div class=&quot;grid grid-cols-1 md:grid-cols-2 gap-6 mb-12&quot;><div class=&quot;bg-gray-50 p-6 rounded-lg border border-gray-200&quot;><h3 class=&quot;text-xl font-bold text-rstu-red mb-4&quot;>Get Legal Help</h3><div class=&quot;space-y-4 text-sm text-gray-700&quot;><div><p class=&quot;font-semibold text-gray-900&quot;>Nevada Legal Services - Tenants' Rights Center<p class=&quot;text-xs mt-1&quot;>Phone: (775) 284-3491 ext. 316</p></div><div><p class=&quot;font-semibold text-gray-900&quot;>Northern Nevada Legal Aid<p class=&quot;text-xs mt-1&quot;>Phone: (775) 329-2727</p></div><div><p class=&quot;font-semibold text-gray-900&quot;>Lawyer in the Library<p class=&quot;text-xs mt-1&quot;>Free 15-minute Zoom consultations with volunteer attorneys every Thursday at 9am</p></div></div></div><div class=&quot;bg-gray-50 p-6 rounded-lg border border-gray-200&quot;><h3 class=&quot;text-xl font-bold text-rstu-red mb-4&quot;>Need Emergency Help?</h3><div class=&quot;space-y-4 text-sm text-gray-700&quot;><div><p class=&quot;font-semibold text-gray-900&quot;>Eviction Diversion Program<p class=&quot;text-xs mt-1&quot;>Phone: (775) 334-3310</p></div><div><p class=&quot;font-semibold text-gray-900&quot;>Emergency Rental Assistance<p class=&quot;text-xs mt-1&quot;>Up to 12 months of rent, utilities, and late fees if eligible</p></div><div><p class=&quot;font-semibold text-gray-900&quot;>Report Code Violations<p class=&quot;text-xs mt-1&quot;>Phone: (775) 334-4636</p></div></div></div></div><div class=&quot;bg-gray-50 p-8 rounded-lg border border-gray-200 mb-12&quot;><h3 class=&quot;text-2xl font-bold text-gray-900 mb-6 text-center&quot;>How to Start Organizing</h3><div class=&quot;grid grid-cols-1 md:grid-cols-3 gap-6&quot;><div class=text-center><div class=&quot;text-3xl font-bold text-rstu-red mb-3&quot;>1</div><h4 class=&quot;font-semibold text-gray-900 mb-2&quot;>Talk to Your Neighbors</h4><p class=&quot;text-sm text-gray-700&quot;>Find out what issues affect your building. You're not the only one dealing with this.</p></div><div class=text-center><div class=&quot;text-3xl font-bold text-rstu-red mb-3&quot;>2</div><h4 class=&quot;font-semibold text-gray-900 mb-2&quot;>Know Your Rights</h4><p class=&quot;text-sm text-gray-700&quot;>Learn NRS 118A protections. Use RSTU Connect to document issues and connect with other tenants.</p></div><div class=text-center><div class=&quot;text-3xl font-bold text-rstu-red mb-3&quot;>3</div><h4 class=&quot;font-semibold text-gray-900 mb-2&quot;>Build Power Together</h4><p class=&quot;text-sm text-gray-700&quot;>When you organize collectively, landlords have to listen. Contact RSTU to help you build a tenant organization.</p></div></div></div><div class=text-center><p class=&quot;text-lg text-gray-900 mb-6&quot;>Ready to get organized?<p class=&quot;text-sm text-gray-600&quot;>Contact RSTU Connect to learn more about organizing in your building</p></div></div></section></div><div id=cta><section class=&quot;py-12 sm:py-16 px-4 bg-gradient-to-br from-rstu-red to-red-700&quot;><div class=&quot;max-w-4xl mx-auto text-center&quot;><h2 class=&quot;text-4xl sm:text-5xl lg:text-6xl font-bold text-white mb-6 leading-tight&quot;>Ready to Get Involved?</h2><p class=&quot;text-lg sm:text-xl text-white mb-12 opacity-95 max-w-2xl mx-auto&quot;>Join tenant organizers in Reno-Sparks building collective power</p><button class=&quot;inline-block px-12 py-5 bg-white text-rstu-red font-bold text-lg sm:text-xl rounded-lg hover:bg-gray-100 transition-all duration-200 shadow-xl hover:shadow-2xl hover:scale-105 transform&quot;>Enter RSTU Connect</button><div class=&quot;mt-16 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6&quot;><button class=&quot;group text-left bg-white bg-opacity-10 hover:bg-opacity-20 border border-white border-opacity-20 rounded-lg p-6 transition-all duration-200 text-white&quot;><h3 class=&quot;text-lg font-bold mb-2 group-hover:text-yellow-200 transition-colors&quot;>Explore the Library</h3><p class=&quot;text-sm text-white text-opacity-90&quot;>Dive into 3,400+ organizing documents and theory resources</p></button><button class=&quot;group text-left bg-white bg-opacity-10 hover:bg-opacity-20 border border-white border-opacity-20 rounded-lg p-6 transition-all duration-200 text-white&quot;><h3 class=&quot;text-lg font-bold mb-2 group-hover:text-yellow-200 transition-colors&quot;>Find Your Building</h3><p class=&quot;text-sm text-white text-opacity-90&quot;>Search 16,000+ rental properties and see where organizing is happening</p></button><button class=&quot;group text-left bg-white bg-opacity-10 hover:bg-opacity-20 border border-white border-opacity-20 rounded-lg p-6 transition-all duration-200 text-white&quot;><h3 class=&quot;text-lg font-bold mb-2 group-hover:text-yellow-200 transition-colors&quot;>Organize In-Person</h3><p class=&quot;text-sm text-white text-opacity-90&quot;>Attend meetings in Reno and Sparks. Questions? Text or email us.</p></button></div></div></section></div></div></div></div><footer class=&quot;border-t border-gray-200 bg-white&quot;><div class=&quot;max-w-full px-4 sm:px-6 lg:px-8 py-3 text-center&quot;><p class=&quot;text-xs text-gray-500 m-0&quot;><a href=https://renosparkstenantsunion.org/ class=&quot;text-rstu-red hover:text-rstu-red-dark font-medium&quot;>RSTU Main Site</a> · <a href=https://docs.google.com/forms/d/e/1FAIpQLSc4Fgq0sW7BFHfFLDvM8NIUIKLtnkDTC9RwUQ1rLin8ZqyoSQ/viewform target=_blank rel=&quot;noopener noreferrer&quot; class=&quot;text-gray-600 hover:text-gray-900&quot;>Contact</a> · <span>© 2025 Reno-Sparks Tenants Union</span></p></div></footer></main>"></iframe>
