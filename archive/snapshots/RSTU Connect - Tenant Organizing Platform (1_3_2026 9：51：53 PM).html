espace-nowrap text-gray-900 font-medium&quot;>Home</button><button class=&quot;whitespace-nowrap text-gray-600 hover:text-gray-900&quot;>Organize</button><button class=&quot;whitespace-nowrap text-gray-600 hover:text-gray-900&quot;>Reading</button><button class=&quot;whitespace-nowrap text-gray-600 hover:text-gray-900&quot;>Mutual Aid</button><button class=&quot;whitespace-nowrap text-gray-600 hover:text-gray-900&quot;>Tools</button><button class=&quot;whitespace-nowrap flex items-center gap-2 relative text-gray-600 hover:text-gray-900&quot;>Profile</button><a href=https://renosparkstenantsunion.org/ class=&quot;text-rstu-red hover:text-rstu-red-dark font-medium whitespace-nowrap&quot;>Main site</a></nav><div class=&quot;lg:hidden flex items-center gap-2 sf-hidden&quot;></div></div></div></div></header><div class=flex-1><div class=&quot;w-full bg-gradient-to-b from-white to-gray-50&quot;><div><div id=hero><section class=&quot;relative w-full py-12 sm:py-16 md:py-20 lg:py-28 px-4 bg-white&quot;><div class=&quot;max-w-4xl mx-auto text-center&quot;><div class=mb-8><h1 class=&quot;text-sm font-bold text-rstu-red uppercase tracking-wide mb-2&quot;>Reno-Sparks Tenants Union</h1><p class=&quot;text-xs text-gray-500&quot;>Nevada's First Tenants Union</p></div><h2 class=&quot;text-4xl sm:text-5xl lg:text-6xl font-bold text-gray-900 mb-8 leading-tight&quot;>Facing Rent Increases? Eviction? Repairs Ignored?</h2><p class=&quot;text-lg sm:text-xl text-gray-600 max-w-2xl mx-auto mb-8 leading-relaxed&quot;>We organize tenants in Reno-Sparks and Washoe County to fight for housing justice. We believe in collective power, solidarity, and the radical idea that housing should be a right, not a commodity.<div class=&quot;flex flex-col sm:flex-row gap-4 justify-center mb-12&quot;><button class=&quot;px-8 py-3 bg-rstu-red text-white font-semibold rounded-lg hover:bg-red-700 transition-colors text-center&quot;>Enter RSTU Connect</button><button class=&quot;px-8 py-3 border-2 border-gray-300 text-gray-700 font-semibold rounded-lg hover:border-rstu-red hover:text-rstu-red transition-colors text-center&quot;>Learn More</button></div><div class=&quot;flex justify-center animate-pulse&quot;><button class=&quot;text-gray-400 hover:text-gray-600 transition-colors&quot; aria-label=&quot;Scroll to next section&quot;><svg class=&quot;w-6 h-6&quot; fill=none stroke=currentColor viewBox=&quot;0 0 24 24&quot;><path stroke-linecap=round stroke-linejoin=round stroke-width=2 d=&quot;M19 14l-7 7m0 0l-7-7m7 7V3&quot;></path></svg></button></div></div><div class=&quot;absolute bottom-0 left-0 right-0 h-px bg-gradient-to-r from-transparent via-gray-300 to-transparent&quot;></div></section></div><div id=philosophy><section class=&quot;py-16 sm:py-20 px-4 bg-white&quot;><div class=&quot;max-w-4xl mx-auto&quot;><div class=mb-16><h2 class=&quot;text-3xl sm:text-4xl lg:text-5xl font-bold text-gray-900 mb-12 leading-tight&quot;>Why We Organize</h2><div class=space-y-4><div class=&quot;bg-gradient-to-r from-rstu-red to-red-600 text-white rounded-lg p-8 sm:p-10 border-l-4 border-yellow-300 shadow-lg hover:shadow-xl transition-shadow&quot;><p class=&quot;text-xl sm:text-2xl lg:text-3xl font-bold leading-relaxed&quot;>Housing is a human right, not a commodity to be bought and sold for profit.</p></div><div class=&quot;bg-gradient-to-r from-red-600 to-red-700 text-white rounded-lg p-8 sm:p-10 border-l-4 border-yellow-300 shadow-lg hover:shadow-xl transition-shadow&quot;><p class=&quot;text-xl sm:text-2xl lg:text-3xl font-bold leading-relaxed&quot;>When landlords own our homes, they own our power.</p></div><div class=&quot;bg-gradient-to-r from-red-700 to-rstu-red text-white rounded-lg p-8 sm:p-10 border-l-4 border-yellow-300 shadow-lg hover:shadow-xl transition-shadow&quot;><p class=&quot;text-xl sm:text-2xl lg:text-3xl font-bold leading-relaxed&quot;>We organize to reclaim that power—collectively.</p></div></div></div><div class=mb-16><h3 class=&quot;text-2xl font-bold text-gray-900 mb-8 text-center&quot;>What We Believe</h3><div class=&quot;grid grid-cols-1 md:grid-cols-3 gap-6&quot;><div class=&quot;bg-gray-50 rounded-lg p-8 border-l-4 border-rstu-red&quot;><h4 class=&quot;text-xl font-bold text-gray-900 mb-3&quot;>Housing is a Human Right</h4><p class=&quot;text-base text-gray-700 leading-relaxed&quot;>Everyone deserves a safe, stable, and comfortable home—no matter their income, background, or circumstance. Housing is not a luxury for the wealthy. It is essential to human dignity.</p></div><div class=&quot;bg-gray-50 rounded-lg p-8 border-l-4 border-rstu-red&quot;><h4 class=&quot;text-xl font-bold text-gray-900 mb-3&quot;>Landlord &amp;amp; Tenant Interests Are Irreconcilable</h4><p class=&quot;text-base text-gray-700 leading-relaxed&quot;>There is a fundamental conflict: landlords profit from extracting wealth from tenants. Their interests can never align with ours. We cannot negotiate away a system designed to exploit us.</p></div><div class=&quot;bg-gray-50 rounded-lg p-8 border-l-4 border-rstu-red&quot;><h4 class=&quot;text-xl font-bold text-gray-900 mb-3&quot;>Solidarity is Our Strength</h4><p class=&quot;text-base text-gray-700 leading-relaxed&quot;>An injury to one is an injury to all. Our power comes from standing together—across buildings, neighborhoods, and communities. When we fight collectively, we win.</p></div></div></div><div class=&quot;mt-16 flex items-center gap-4&quot;><div class=&quot;flex-1 h-px bg-gray-300&quot;></div><span class=&quot;text-gray-400 font-semibold&quot;>≈</span><div class=&quot;flex-1 h-px bg-gray-300&quot;></div></div></div></section></div><div id=what-we-do><section class=&quot;py-16 sm:py-20 px-4 bg-white&quot;><div class=&quot;max-w-6xl mx-auto&quot;><div class=&quot;text-center mb-16&quot;><h2 class=&quot;text-4xl sm:text-5xl font-bold text-gray-900 mb-6&quot;>How Tenants Win</h2><div class=&quot;max-w-3xl mx-auto text-lg text-gray-700 leading-relaxed&quot;><p class=mb-4>Power doesn't come from landlords or politicians—it comes from us, organized collectively. We build tenant power through three interconnected strategies that reinforce each other.<p>These strategies aren't new. They're rooted in decades of tenant movements, labor struggles, and anarchist theory about how ordinary people take control of their own lives. They work because they're designed to shift power from those who profit from housing toward those who need it to survive.</p></div></div><div class=&quot;grid grid-cols-1 md:grid-cols-3 gap-6 mb-8&quot;><div class=&quot;bg-gray-50 rounded-lg p-8 border border-gray-200 hover:shadow-lg transition-shadow&quot;><div class=&quot;mb-6 w-12 h-12 bg-rstu-red bg-opacity-20 rounded-lg flex items-center justify-center&quot;><svg class=&quot;w-6 h-6 text-rstu-red&quot; fill=none stroke=currentColor viewBox=&quot;0 0 24 24&quot;><path stroke-linecap=round stroke-linejoin=round stroke-width=2 d=&quot;M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5.5m0 0H9m11 0v-7a6 6 0 00-6-6 6 6 0 00-6 6v7m12 0H7&quot;></path></svg></div><h3 class=&quot;text-2xl font-bold text-gray-900 mb-2&quot;>Build Tenant Associations</h3><p class=&quot;text-xs text-gray-500 font-medium mb-3 uppercase&quot;>Libertarian Municipalism: Direct Democracy from the Ground Up<p class=&quot;text-base text-gray-700 leading-relaxed mb-4&quot;>Start with your building. Organize your neighbors to address maintenance problems, fight unjust evictions, and negotiate with landlords from a position of collective power. Building assemblies aren't just tactics—they're the foundation for democratic decision-making controlled by tenants, not leadership.<p class=&quot;text-sm text-rstu-red font-semibold&quot;>Power flows upward from assemblies, not downward from leaders</p></div><div class=&quot;bg-gray-50 rounded-lg p-8 border border-gray-200 hover:shadow-lg transition-shadow&quot;><div class=&quot;mb-6 w-12 h-12 bg-rstu-red bg-opacity-20 rounded-lg flex items-center justify-center&quot;><svg class=&quot;w-6 h-6 text-rstu-red&quot; fill=none stroke=currentColor viewBox=&quot;0 0 24 24&quot;><path stroke-linecap=round stroke-linejoin=round stroke-width=2 d=&quot;M17 20h5v-2a3 3 0 00-5.856-1.487M15 10h.01M11 10h.01M7 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z&quot;></path></svg></div><h3 class=&quot;text-2xl font-bold text-gray-900 mb-2&quot;>Mutual Aid Networks</h3><p class=&quot;text-xs text-gray-500 font-medium mb-3 uppercase&quot;>Kropotkin: Solidarity Over Charity<p class=&quot;text-base text-gray-700 leading-relaxed mb-4&quot;>When landlords retaliate, when rent becomes impossible, when someone loses housing—we support each other. Mutual aid isn't charity; it's solidarity. We share resources, knowledge, and care based on what people need and what we have to give, with no hierarchy and no judgment.<p class=&quot;text-sm text-rstu-red font-semibold&quot;>An injury to one is an injury to all</p></div><div class=&quot;bg-gray-50 rounded-lg p-8 border border-gray-200 hover:shadow-lg transition-shadow&quot;><div class=&quot;mb-6 w-12 h-12 bg-rstu-red bg-opacity-20 rounded-lg flex items-center justify-center&quot;><svg class=&quot;w-6 h-6 text-rstu-red&quot; fill=none stroke=currentColor viewBox=&quot;0 0 24 24&quot;><path stroke-linecap=round stroke-linejoin=round stroke-width=2 d=&quot;M12 19l9 2-9-18-9 18 9-2m0 0v-8m0 8l-6-4m6 4l6-4&quot;></path></svg></div><h3 class=&quot;text-2xl font-bold text-gray-900 mb-2&quot;>Direct Action &amp;amp; Campaigns</h3><p class=&quot;text-xs text-gray-500 font-medium mb-3 uppercase&quot;>Class Struggle: Confronting Power Where It Is<p class=&quot;text-base text-gray-700 leading-relaxed mb-4&quot;>We demand change through organized action: eviction defense, rent strikes, city council pressure, and campaigns that make landlords and politicians feel our collective power. Landlords won't voluntarily give up profit—we have to take it back through confrontation and coordinated action.<p class=&quot;text-sm text-rstu-red font-semibold&quot;>Without struggle, there is no change</p></div></div><div class=&quot;bg-red-50 border border-red-200 rounded-lg p-8&quot;><p class=&quot;text-base text-gray-900 leading-relaxed mb-4&quot;><strong>These three strategies embody a coherent philosophy of power.</strong><ul class=&quot;space-y-2 text-base text-gray-700&quot;><li class=&quot;flex gap-3&quot;><span class=&quot;text-rstu-red font-bold flex-shrink-0&quot;>•</span><span>Municipalism: Building democratic power through tenant assemblies, bottom-up decision-making, and confederation between groups</span><li class=&quot;flex gap-3&quot;><span class=&quot;text-rstu-red font-bold flex-shrink-0&quot;>•</span><span>Mutual Aid: Building solidarity by meeting each other's needs collectively, outside of capitalist hierarchies</span><li class=&quot;flex gap-3&quot;><span class=&quot;text-rstu-red font-bold flex-shrink-0&quot;>•</span><span>Dual Power: Resisting landlord exploitation AND building alternative structures that prove we can run housing ourselves</span></ul></div><div class=&quot;mt-12 flex items-center gap-4&quot;><div class=&quot;flex-1 h-px bg-gray-200&quot;></div><span class=&quot;text-gray-400 font-semibold&quot;>≈</span><div class=&quot;flex-1 h-px bg-gray-200&quot;></div></div></div></section></div><div id=values><section class=&quot;py-16 sm:py-20 px-4 bg-white&quot;><div class=&quot;max-w-6xl mx-auto&quot;><div class=&quot;text-center mb-16&quot;><h2 class=&quot;text-4xl sm:text-5xl font-bold text-gray-900 mb-6&quot;>What We Stand For</h2><p class=&quot;text-lg text-gray-600 max-w-3xl mx-auto&quot;>Five core principles that guide our organizing</p></div><div class=&quot;grid grid-cols-1 md:grid-cols-2 gap-8 max-w-4xl mx-auto&quot;><div class=&quot;group relative&quot;><div class=&quot;absolute left-0 top-0 bottom-0 w-2 bg-rstu-red rounded-l-lg&quot;></div><div class=&quot;bg-gray-50 rounded-lg p-8 pl-6 border-l-4 border-rstu-red hover:shadow-lg transition-shadow duration-200&quot;><div class=&quot;inline-block w-12 h-12 rounded-lg mb-4 bg-yellow-100 border-yellow-500 border-2 flex items-center justify-center&quot;><span class=text-2xl>✊</span></div><h3 class=&quot;text-xl font-bold text-gray-900 mb-4 group-hover:text-rstu-red transition-colors&quot;>Racial Justice &amp;amp; Equality</h3><p class=&quot;text-base text-gray-700 leading-relaxed&quot;>We fight for housing for all regardless of income, race, gender identity, sexual orientation, immigration status, and ability. We recognize the history of discriminatory housing policies targeting Black and Brown communities. Racial justice is essential to tenant liberation.</p></div></div><div class=&quot;group relative&quot;><div class=&quot;absolute left-0 top-0 bottom-0 w-2 bg-rstu-red rounded-l-lg&quot;></div><div class=&quot;bg-gray-50 rounded-lg p-8 pl-6 border-l-4 border-rstu-red hover:shadow-lg transition-shadow duration-200&quot;><div class=&quot;inline-block w-12 h-12 rounded-lg mb-4 bg-blue-100 border-blue-500 border-2 flex items-center justify-center&quot;><span class=text-2xl>🏘️</span></div><h3 class=&quot;text-xl font-bold text-gray-900 mb-4 group-hover:text-rstu-red transition-colors&quot;>Anti-Gentrification &amp;amp; Housing Justice</h3><p class=&quot;text-base text-gray-700 leading-relaxed&quot;>We are opposed to the displacement of people and communities through gentrification. Gentrification is not inevitable—it's a deliberate process. Housing justice is indivisible: we can't fight for tenants while abandoning unhoused community members.</p></div></div></div><div class=&quot;mt-16 bg-blue-50 border border-blue-200 rounded-lg p-6 max-w-3xl mx-auto text-center&quot;><p class=&quot;text-sm text-blue-900&quot;><strong>These values build on the foundation</strong> of housing as a right, class struggle, and mutual solidarity established above. Racial justice and anti-gentrification ensure we fight for ALL people experiencing housing injustice.</p></div><div class=&quot;mt-16 flex items-center gap-4&quot;><div class=&quot;flex-1 h-px bg-gray-300&quot;></div><span class=&quot;text-gray-400 font-semibold&quot;>≈</span><div class=&quot;flex-1 h-px bg-gray-300&quot;></div></div></div></section></div><div id=philosophy-pillars><section class=&quot;py-16 sm:py-20 px-4 bg-white&quot;><div class=&quot;max-w-6xl mx-auto&quot;><div class=&quot;max-w-3xl mx-auto mb-16&quot;><h2 class=&quot;text-4xl sm:text-5xl font-bold text-gray-900 mb-6&quot;>Our Organizing Philosophy</h2><p class=&quot;text-lg text-gray-700 leading-relaxed mb-4&quot;>We don't just fight to win concessions from landlords. We fight to build a different kind of power—collective, democratic, and rooted in solidarity. Our philosophy rests on three pillars that work together to transform how we live, relate to each other, and understand what's possible.<p class=&quot;text-base text-gray-600 italic&quot;>These are not separate strategies but interconnected principles that reinforce each other.</p></div><div class=&quot;grid grid-cols-1 md:grid-cols-3 gap-8 mb-16&quot;><div class=&quot;bg-white rounded-lg p-8 border border-gray-200 hover:border-rstu-red hover:shadow-lg transition-all duration-200&quot;><div class=mb-6><h3 class=&quot;text-2xl font-bold text-gray-900 mb-2&quot;>Libertarian Municipalism</h3><p class=&quot;text-sm text-gray-600 font-medium&quot;>— Murray Bookchin</p></div><div class=&quot;bg-red-50 border-l-4 border-rstu-red p-4 mb-6&quot;><p class=&quot;text-sm italic text-gray-700&quot;>&quot;Power cannot be used to abolish hierarchy; it can only reinforce it. We need confederal structures where power flows upward from assemblies of ordinary people, not from the top down.&quot;</p></div><p class=&quot;text-base text-gray-700 leading-relaxed mb-6&quot;>Democracy is not a distant vote for distant politicians. It is tenants in a building deciding together how to live. Libertarian municipalism starts with neighborhood and building assemblies where ordinary people deliberate, decide, and act directly on the issues affecting their lives. These assemblies then confederate—linking together without centralizing authority—creating networks of power that remain accountable to those they represent. This is how we overcome the separation between rulers and ruled, and how we build power from the ground up.<div class=space-y-3><p class=&quot;text-xs font-semibold text-gray-500 uppercase&quot;>Core Concepts:<ul class=space-y-2><li class=&quot;flex gap-3 text-sm text-gray-700&quot;><span class=&quot;text-rstu-red font-bold flex-shrink-0&quot;>•</span><span>Direct democracy: assemblies where tenants make decisions together</span><li class=&quot;flex gap-3 text-sm text-gray-700&quot;><span class=&quot;text-rstu-red font-bold flex-shrink-0&quot;>•</span><span>Confederation: networks of equal groups, not hierarchies</span><li class=&quot;flex gap-3 text-sm text-gray-700&quot;><span class=&quot;text-rstu-red font-bold flex-shrink-0&quot;>•</span><span>Accountability: representatives answerable to assemblies</span><li class=&quot;flex gap-3 text-sm text-gray-700&quot;><span class=&quot;text-rstu-red font-bold flex-shrink-0&quot;>•</span><span>Localism with solidarity: decisions at the neighborhood level, coordinated across communities</span></ul></div></div><div class=&quot;bg-white rounded-lg p-8 border border-gray-200 hover:border-rstu-red hover:shadow-lg transition-all duration-200&quot;><div class=mb-6><h3 class=&quot;text-2xl font-bold text-gray-900 mb-2&quot;>Mutual Aid</h3><p class=&quot;text-sm text-gray-600 font-medium&quot;>— Peter Kropotkin</p></div><div class=&quot;bg-red-50 border-l-4 border-rstu-red p-4 mb-6&quot;><p class=&quot;text-sm italic text-gray-700&quot;>&quot;Mutual aid is the tendency of all living organisms to help each other. Cooperation, not competition, is the natural state of survival.&quot;</p></div><p class=&quot;text-base text-gray-700 leading-relaxed mb-6&quot;>The capitalist myth says we compete as isolated individuals fighting for survival. Mutual aid tells the truth: humans survive and flourish through cooperation. When a tenant faces eviction, their neighbors organize a defense. When rent becomes impossible, we pool resources. When the state fails the unhoused, we build shelter together. Mutual aid is not charity—it has no hierarchy of giver and receiver. It is solidarity: the reciprocal understanding that we survive together or not at all. It is how we meet each other's needs outside and against capitalist markets, building the relations of care that will sustain us in the liberated world we're building.<div class=space-y-3><p class=&quot;text-xs font-semibold text-gray-500 uppercase&quot;>Core Concepts:<ul class=space-y-2><li class=&quot;flex gap-3 text-sm text-gray-700&quot;><span class=&quot;text-rstu-red font-bold flex-shrink-0&quot;>•</span><span>Solidarity as principle: an injury to one is an injury to all</span><li class=&quot;flex gap-3 text-sm text-gray-700&quot;><span class=&quot;text-rstu-red font-bold flex-shrink-0&quot;>•</span><span>Reciprocity, not hierarchy: we all give and receive</span><li class=&quot;flex gap-3 text-sm text-gray-700&quot;><span class=&quot;text-rstu-red font-bold flex-shrink-0&quot;>•</span><span>Collective care: meeting needs through mutual support</span><li class=&quot;flex gap-3 text-sm text-gray-700&quot;><span class=&quot;text-rstu-red font-bold flex-shrink-0&quot;>•</span><span>Alternative to markets: resources distributed by need, not profit</span></ul></div></div><div class=&quot;bg-white rounded-lg p-8 border border-gray-200 hover:border-rstu-red hover:shadow-lg transition-all duration-200&quot;><div class=mb-6><h3 class=&quot;text-2xl font-bold text-gray-900 mb-2&quot;>Dual Power</h3><p class=&quot;text-sm text-gray-600 font-medium&quot;>— Tenants' Rights Organizers</p></div><div class=&quot;bg-red-50 border-l-4 border-rstu-red p-4 mb-6&quot;><p class=&quot;text-sm italic text-gray-700&quot;>&quot;We do not win by asking the landlord to be kind. We win by making our collective power so undeniable that the landlord has no choice but to concede. And as we win, we build the institutions of a world without landlords.&quot;</p></div><p class=&quot;text-base text-gray-700 leading-relaxed mb-6&quot;>Dual power means fighting on two fronts simultaneously. First, we confront the power of landlords and the state with organized action: rent strikes, eviction defense, political pressure. We make collective power visible and irresistible. But confrontation alone cannot build the world we need. So second, we build alternative structures that prove another way is possible: tenant assemblies that govern democratically, mutual aid networks that meet needs collectively, cooperative housing that provides shelter without extraction. As we fight the old world, we construct the new world within it. Neither confrontation nor construction alone is enough—together they form a strategy that weakens landlord control while strengthening tenant power and prefiguring the liberated world we seek.<div class=space-y-3><p class=&quot;text-xs font-semibold text-gray-500 uppercase&quot;>Core Concepts:<ul class=space-y-2><li class=&quot;flex gap-3 text-sm text-gray-700&quot;><span class=&quot;text-rstu-red font-bold flex-shrink-0&quot;>•</span><span>Resistance: confronting landlord power through organized struggle</span><li class=&quot;flex gap-3 text-sm text-gray-700&quot;><span class=&quot;text-rstu-red font-bold flex-shrink-0&quot;>•</span><span>Construction: building democratic and cooperative alternatives</span><li class=&quot;flex gap-3 text-sm text-gray-700&quot;><span class=&quot;text-rstu-red font-bold flex-shrink-0&quot;>•</span><span>Prefiguration: the means we use shape the world we create</span><li class=&quot;flex gap-3 text-sm text-gray-700&quot;><span class=&quot;text-rstu-red font-bold flex-shrink-0&quot;>•</span><span>Integration: resistance and construction reinforce each other</span></ul></div></div></div><div class=&quot;bg-red-50 border border-red-200 rounded-lg p-8 max-w-4xl mx-auto mb-8&quot;><h3 class=&quot;text-2xl font-bold text-gray-900 mb-4&quot;>Three Pillars, One Power</h3><div class=&quot;space-y-4 text-base text-gray-700&quot;><p>These three pillars are not separate—they work together. Municipalism gives us the democratic form: how we decide together. Mutual aid gives us the social content: how we care for each other. Dual power gives us the strategy: how we confront landlord power while building alternatives.<p>When we build tenant associations, we're practicing municipalism—creating assemblies where ordinary tenants make decisions that affect their lives. When we organize mutual aid networks, we're proving that we can meet each other's needs without landlord profiteers. When we wage direct action campaigns, we're exercising dual power—resisting exploitation while building the tenant power structures that will sustain us in a liberated future.<p>This is how we move from complaint to power, from survival to liberation. Not by accepting the world as it is, but by actively constructing the world as it should be.</p></div></div><div class=&quot;mt-12 flex items-center gap-4&quot;><div class=&quot;flex-1 h-px bg-gray-200&quot;></div><span class=&quot;text-gray-400 font-semibold&quot;>≈</span><div class=&quot;flex-1 h-px bg-gray-200&quot;></div></div></div></section></div><div id=readings><section class=&quot;py-16 sm:py-20 px-4 bg-gray-50&quot;><div class=&quot;max-w-6xl mx-auto&quot;><div class=&quot;text-center mb-12&quot;><h2 class=&quot;text-4xl sm:text-5xl font-bold text-gray-900 mb-4&quot;>Start Here: Essential Reading</h2><p class=&quot;text-lg text-gray-600&quot;>Dive into RSTU's library of 900+ organizing resources</p></div><div class=&quot;text-center py-12&quot;><p class=text-gray-500>Loading featured documents...</p></div><div class=&quot;mt-12 bg-gradient-to-r from-rstu-red to-red-700 rounded-lg p-8 text-white text-center&quot;><h3 class=&quot;text-2xl font-bold mb-3&quot;>Explore the Full Library</h3><p class=&quot;mb-6 max-w-2xl mx-auto&quot;>These are just a few highlights. Dive into our complete reading library with 900+ documents on organizing, theory, housing justice, labor history, and mutual aid.</p><button class=&quot;inline-block px-8 py-3 bg-white text-rstu-red font-semibold rounded-lg hover:bg-gray-100 transition-colors&quot;>Browse Full Library →</button></div><div class=&quot;mt-12 flex items-center gap-4&quot;><div class=&quot;flex-1 h-px bg-gray-300&quot;></div><span class=&quot;text-gray-400 font-semibold&quot;>≈</span><div class=&quot;flex-1 h-px bg-gray-300&quot;></div></div></div></section></div><div id=cta><section class=&quot;py-20 sm:py-28 px-4 bg-gradient-to-br from-rstu-red to-red-700&quot;><div class=&quot;max-w-4xl mx-auto text-center&quot;><h2 class=&quot;text-4xl sm:text-5xl lg:text-6xl font-bold text-white mb-6 leading-tight&quot;>Ready to Get Involved?</h2><p class=&quot;text-lg sm:text-xl text-white mb-12 opacity-95 max-w-2xl mx-auto&quot;>Join tenant organizers in Reno-Sparks building collective power</p><button class=&quot;inline-block px-12 py-5 bg-white text-rstu-red font-bold text-lg sm:text-xl rounded-lg hover:bg-gray-100 transition-all duration-200 shadow-xl hover:shadow-2xl hover:scale-105 transform&quot;>Enter RSTU Connect</button><div class=&quot;mt-16 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6&quot;><button class=&quot;group text-left bg-white bg-opacity-10 hover:bg-opacity-20 border border-white border-opacity-20 rounded-lg p-6 transition-all duration-200 text-white&quot;><h3 class=&quot;text-lg font-bold mb-2 group-hover:text-yellow-200 transition-colors&quot;>Explore the Library</h3><p class=&quot;text-sm text-white text-opacity-90&quot;>Dive into 3,400+ organizing documents and theory resources</p></button><button class=&quot;group text-left bg-white bg-opacity-10 hover:bg-opacity-20 border border-white border-opacity-20 rounded-lg p-6 transition-all duration-200 text-white
