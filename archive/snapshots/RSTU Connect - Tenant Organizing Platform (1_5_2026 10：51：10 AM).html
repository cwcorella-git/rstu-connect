quot;><svg class=&quot;w-full h-full&quot; viewBox=&quot;0 0 100 100&quot; preserveAspectRatio=none><defs><pattern id=grid width=10 height=10 patternUnits=userSpaceOnUse><path d=&quot;M 10 0 L 0 0 0 10&quot; fill=none stroke=#cc0000 stroke-width=0.5></path></pattern></defs><rect width=100 height=100 fill=url(#grid)></rect></svg></div><div class=&quot;relative z-10 w-full max-w-3xl mx-auto text-center py-20&quot;><h1 class=&quot;text-3xl sm:text-4xl lg:text-5xl font-black text-white mb-8 leading-tight&quot;>Facing Rent Increases? Eviction? Repairs Ignored?</h1><p class=&quot;text-xl sm:text-2xl text-gray-200 mb-12 leading-relaxed font-semibold&quot;>You have rights. You have neighbors. Here's what works.<p class=&quot;text-lg text-gray-300 mb-12 leading-relaxed max-w-2xl mx-auto&quot;>Tenants across America are winning. Rent control in 6 states. Habitability protections. Eviction defense. We show you the legal tools you have and how to use collective power to enforce them.<div class=mb-12><button class=&quot;inline-block px-10 py-4 bg-rstu-red text-white font-bold text-lg rounded-lg hover:bg-red-700 transition-all duration-200 shadow-lg hover:shadow-xl transform hover:scale-105&quot;>Find Your Building</button></div><button class=&quot;inline-flex items-center gap-2 text-gray-300 hover:text-white transition-colors font-semibold&quot;>Learn More<svg class=&quot;w-5 h-5&quot; fill=none stroke=currentColor viewBox=&quot;0 0 24 24&quot;><path stroke-linecap=round stroke-linejoin=round stroke-width=2 d=&quot;M19 14l-7 7m0 0l-7-7m7 7V3&quot;></path></svg></button></div><div class=&quot;absolute bottom-8 left-1/2 transform -translate-x-1/2 z-10&quot;><button class=&quot;text-white text-opacity-60 hover:text-opacity-100 transition-all animate-bounce&quot; aria-label=&quot;Scroll to next section&quot;><svg class=&quot;w-6 h-6&quot; fill=none stroke=currentColor viewBox=&quot;0 0 24 24&quot;><path stroke-linecap=round stroke-linejoin=round stroke-width=2 d=&quot;M19 14l-7 7m0 0l-7-7m7 7V3&quot;></path></svg></button></div></section></div><div id=evidence><section class=&quot;py-16 sm:py-24 px-4 bg-white relative overflow-hidden&quot;><div class=&quot;absolute inset-0 opacity-3&quot;><div class=&quot;absolute -right-40 top-1/3 w-80 h-80 bg-rstu-red rounded-full blur-3xl&quot;></div></div><div class=&quot;relative z-10 max-w-4xl mx-auto&quot;><div class=&quot;mb-16 text-center&quot;><h2 class=&quot;text-3xl sm:text-4xl lg:text-5xl font-black text-gray-900 mb-4 leading-tight&quot;>The History: Government Made a Promise—Then Broke It</h2><p class=&quot;text-lg text-gray-700 leading-relaxed max-w-2xl mx-auto&quot;>But tenants across the country are fighting back and winning.</p></div><div class=space-y-8><div class=&quot;relative pl-8 border-l-4 border-rstu-red&quot;><div class=&quot;absolute -left-5 -top-1 w-10 h-10 bg-rstu-red text-white rounded-full flex items-center justify-center font-black text-lg shadow-lg&quot;>1</div><div class=&quot;bg-gray-50 rounded-lg p-8&quot;><h3 class=&quot;text-2xl font-black text-gray-900 mb-3&quot;>1949: Housing for All</h3><p class=&quot;text-gray-700 leading-relaxed mb-3&quot;>The U.S. Housing Act declared &quot;a decent home for every American family&quot; as national policy. The government promised to guarantee housing as a human right.<p class=&quot;text-sm text-rstu-red font-semibold italic&quot;>&quot;The housing shortage must be overcome... and a decent home and suitable living environment for every American family is a legitimate national goal.&quot; — Housing Act of 1949</p></div></div><div class=&quot;relative pl-8 border-l-4 border-rstu-red&quot;><div class=&quot;absolute -left-5 -top-1 w-10 h-10 bg-rstu-red text-white rounded-full flex items-center justify-center font-black text-lg shadow-lg&quot;>2</div><div class=&quot;bg-gray-50 rounded-lg p-8&quot;><h3 class=&quot;text-2xl font-black text-gray-900 mb-3&quot;>1938–1970: Systematic Betrayal</h3><p class=&quot;text-gray-700 leading-relaxed mb-3&quot;>Instead of delivering on that promise, the federal government enforced segregation and created the racial wealth gap that persists today:<ul class=&quot;space-y-2 text-sm text-gray-600&quot;><li>• FHA explicitly mandated racial segregation in its lending standards (1938 Underwriting Manual)<li>• 98% of FHA loans went to white buyers between 1934 and 1968<li>• Urban renewal displaced 1.36 million people, 63% of them Black</ul></div></div><div class=&quot;relative pl-8 border-l-4 border-rstu-red&quot;><div class=&quot;absolute -left-5 -top-1 w-10 h-10 bg-rstu-red text-white rounded-full flex items-center justify-center font-black text-lg shadow-lg&quot;>3</div><div class=&quot;bg-gradient-to-br from-rstu-red to-red-700 text-white rounded-lg p-8&quot;><h3 class=&quot;text-2xl font-black mb-3&quot;>2019–2024: Tenants Are Winning</h3><p class=&quot;leading-relaxed mb-4&quot;>When government failed, tenants organized themselves. They won legal protections, rent caps, and habitability standards by building collective power.<p class=&quot;text-sm font-semibold italic text-yellow-100&quot;>KC Tenants won a 248-day rent strike (2023). California passed statewide rent control (2019). New York expanded tenant protections (2024). Oregon eliminated no-cause evictions (2019).</p></div></div></div><div class=&quot;mt-16 text-center border-t-2 border-gray-200 pt-12&quot;><p class=&quot;text-lg text-gray-700 leading-relaxed max-w-2xl mx-auto font-semibold&quot;>The law gives you rights. But the law alone isn't enough. It took collective power to win those rights. It takes collective power to use them.</p></div></div></section></div><div id=rights><section class=&quot;py-16 sm:py-24 px-4 bg-gray-50 relative overflow-hidden&quot;><div class=&quot;relative z-10 max-w-4xl mx-auto&quot;><div class=&quot;mb-16 text-center&quot;><h2 class=&quot;text-3xl sm:text-4xl lg:text-5xl font-black text-gray-900 mb-4 leading-tight&quot;>Your Rights in Nevada</h2><p class=&quot;text-lg text-gray-700 leading-relaxed max-w-2xl mx-auto&quot;>The law protects you. Know what you have.</p></div><div class=&quot;grid grid-cols-1 md:grid-cols-3 gap-8 mb-12&quot;><div class=&quot;bg-white rounded-lg p-8 border-2 border-gray-200 hover:border-rstu-red transition-all duration-300&quot;><div class=&quot;w-16 h-16 rounded-lg bg-rstu-red bg-opacity-10 flex items-center justify-center mb-6&quot;><svg class=&quot;w-8 h-8 text-rstu-red&quot; fill=none stroke=currentColor viewBox=&quot;0 0 24 24&quot;><path stroke-linecap=round stroke-linejoin=round stroke-width=1.5 d=&quot;M3 12a9 9 0 119 9m0-16a8 8 0 010 16m0-16V7m0 5h5&quot;></path></svg></div><h3 class=&quot;text-xl font-black text-gray-900 mb-3&quot;>Habitability</h3><p class=&quot;text-gray-700 leading-relaxed text-sm&quot;>Under Nevada law (NRS 118A), landlords must maintain habitable housing. If your unit has major code violations (no heat, broken plumbing, structural damage, pests), you have the right to repair and deduct, withhold rent, or break your lease.</p></div><div class=&quot;bg-white rounded-lg p-8 border-2 border-gray-200 hover:border-rstu-red transition-all duration-300&quot;><div class=&quot;w-16 h-16 rounded-lg bg-rstu-red bg-opacity-10 flex items-center justify-center mb-6&quot;><svg class=&quot;w-8 h-8 text-rstu-red&quot; fill=none stroke=currentColor viewBox=&quot;0 0 24 24&quot;><path stroke-linecap=round stroke-linejoin=round stroke-width=1.5 d=&quot;M12 8v4m0 4v.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z&quot;></path></svg></div><h3 class=&quot;text-xl font-black text-gray-900 mb-3&quot;>Retaliation Protection</h3><p class=&quot;text-gray-700 leading-relaxed text-sm&quot;>If you report code violations, join a tenant association, or participate in organizing, your landlord cannot retaliate by raising rent or evicting you. Nevada law explicitly protects tenants who exercise their rights.</p></div><div class=&quot;bg-white rounded-lg p-8 border-2 border-gray-200 hover:border-rstu-red transition-all duration-300&quot;><div class=&quot;w-16 h-16 rounded-lg bg-rstu-red bg-opacity-10 flex items-center justify-center mb-6&quot;><svg class=&quot;w-8 h-8 text-rstu-red&quot; fill=none stroke=currentColor viewBox=&quot;0 0 24 24&quot;><path stroke-linecap=round stroke-linejoin=round stroke-width=1.5 d=&quot;M12 11c0 3.517-1.009 6.799-2.753 9.571m5.506-1.141C19.079 15.849 21 12.146 21 8a9 9 0 11-18 0c0 4.146 1.921 7.849 5.247 10.429m10.506 0C18.991 18.799 20 15.517 20 12a8 8 0 10-16 0c0 3.517 1.009 6.799 2.753 9.571m5.494-1.14C12.921 18.799 14 15.517 14 12a7 7 0 10-14 0c0 3.517 1.009 6.799 2.753 9.571&quot;></path></svg></div><h3 class=&quot;text-xl font-black text-gray-900 mb-3&quot;>Fair Housing</h3><p class=&quot;text-gray-700 leading-relaxed text-sm&quot;>Landlords cannot discriminate based on race, color, national origin, religion, sex, disability, or familial status. This is federal law (Fair Housing Act). No exceptions.</p></div></div><div class=&quot;bg-white rounded-lg border-l-4 border-rstu-red p-8&quot;><h3 class=&quot;text-lg font-black text-gray-900 mb-4&quot;>Know Your Rights</h3><p class=&quot;text-gray-700 leading-relaxed mb-6&quot;>These are just the basics. Your power comes from knowing your rights and using them with others.<ul class=space-y-3><li class=&quot;flex gap-3&quot;><span class=&quot;text-rstu-red font-bold flex-shrink-0&quot;>→</span><span class=text-gray-700>Document everything—photos, texts, emails, maintenance requests</span><li class=&quot;flex gap-3&quot;><span class=&quot;text-rstu-red font-bold flex-shrink-0&quot;>→</span><span class=text-gray-700>Don't pay rent under duress, but don't ignore eviction notices either</span><li class=&quot;flex gap-3&quot;><span class=&quot;text-rstu-red font-bold flex-shrink-0&quot;>→</span><span class=text-gray-700>Connect with neighbors. Collective action is stronger than individual complaints</span></ul></div><div class=&quot;mt-12 text-center p-8 bg-gradient-to-r from-rstu-red to-red-700 text-white rounded-lg&quot;><p class=&quot;text-lg font-semibold leading-relaxed&quot;>The law gives you rights. Organizing gives you power to enforce them.</p></div></div></section></div><div id=wins><section class=&quot;py-16 sm:py-24 px-4 bg-white relative overflow-hidden&quot;><div class=&quot;absolute inset-0 opacity-3&quot;><div class=&quot;absolute -left-40 bottom-0 w-80 h-80 bg-yellow-300 rounded-full blur-3xl&quot;></div></div><div class=&quot;relative z-10 max-w-4xl mx-auto&quot;><div class=&quot;mb-16 text-center&quot;><h2 class=&quot;text-3xl sm:text-4xl lg:text-5xl font-black text-gray-900 mb-4 leading-tight&quot;>What Organizing Wins</h2><p class=&quot;text-lg text-gray-700 leading-relaxed max-w-2xl mx-auto&quot;>Real people fought back and changed the law. You can too.</p></div><div class=&quot;grid grid-cols-1 md:grid-cols-2 gap-8 mb-12&quot;><div class=&quot;relative group&quot;><div class=&quot;absolute -inset-1 bg-gradient-to-br from-rstu-red to-red-600 opacity-0 group-hover:opacity-5 rounded-lg transition-all duration-300 blur&quot;></div><div class=&quot;relative bg-white rounded-lg border-2 border-gray-100 group-hover:border-rstu-red p-8 transition-all duration-300&quot;><div class=&quot;inline-block mb-4 px-3 py-1 bg-rstu-red bg-opacity-10 text-rstu-red font-bold rounded-full text-sm&quot;>2023</div><div class=&quot;w-12 h-12 rounded-lg bg-rstu-red bg-opacity-10 flex items-center justify-center mb-4&quot;><svg class=&quot;w-6 h-6 text-rstu-red&quot; fill=none stroke=currentColor viewBox=&quot;0 0 24 24&quot;><path stroke-linecap=round stroke-linejoin=round stroke-width=1.5 d=&quot;M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z&quot;></path></svg></div><h3 class=&quot;text-xl font-black text-gray-900 mb-3&quot;>KC Tenants Win 248-Day Rent Strike</h3><p class=&quot;text-gray-700 leading-relaxed text-sm&quot;>Tenants in Kansas City refused to pay rent for eight months until their landlord made necessary repairs. The landlord capitulated. Organizing works.</p></div></div><div class=&quot;relative group&quot;><div class=&quot;absolute -inset-1 bg-gradient-to-br from-rstu-red to-red-600 opacity-0 group-hover:opacity-5 rounded-lg transition-all duration-300 blur&quot;></div><div class=&quot;relative bg-white rounded-lg border-2 border-gray-100 group-hover:border-rstu-red p-8 transition-all duration-300&quot;><div class=&quot;inline-block mb-4 px-3 py-1 bg-rstu-red bg-opacity-10 text-rstu-red font-bold rounded-full text-sm&quot;>2019</div><div class=&quot;w-12 h-12 rounded-lg bg-rstu-red bg-opacity-10 flex items-center justify-center mb-4&quot;><svg class=&quot;w-6 h-6 text-rstu-red&quot; fill=none stroke=currentColor viewBox=&quot;0 0 24 24&quot;><path stroke-linecap=round stroke-linejoin=round stroke-width=1.5 d=&quot;M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z&quot;></path></svg></div><h3 class=&quot;text-xl font-black text-gray-900 mb-3&quot;>California: First Statewide Rent Control</h3><p class=&quot;text-gray-700 leading-relaxed text-sm&quot;>After decades of tenant organizing, California passed AB 1482, capping rent increases at 5% + inflation per year and limiting eviction-for-no-reason.</p></div></div><div class=&quot;relative group&quot;><div class=&quot;absolute -inset-1 bg-gradient-to-br from-rstu-red to-red-600 opacity-0 group-hover:opacity-5 rounded-lg transition-all duration-300 blur&quot;></div><div class=&quot;relative bg-white rounded-lg border-2 border-gray-100 group-hover:border-rstu-red p-8 transition-all duration-300&quot;><div class=&quot;inline-block mb-4 px-3 py-1 bg-rstu-red bg-opacity-10 text-rstu-red font-bold rounded-full text-sm&quot;>2024</div><div class=&quot;w-12 h-12 rounded-lg bg-rstu-red bg-opacity-10 flex items-center justify-center mb-4&quot;><svg class=&quot;w-6 h-6 text-rstu-red&quot; fill=none stroke=currentColor viewBox=&quot;0 0 24 24&quot;><path stroke-linecap=round stroke-linejoin=round stroke-width=1.5 d=&quot;M13 10V3L4 14h7v7l9-11h-7z&quot;></path></svg></div><h3 class=&quot;text-xl font-black text-gray-900 mb-3&quot;>New York: Tenant Protections Expanded</h3><p class=&quot;text-gray-700 leading-relaxed text-sm&quot;>New York strengthened &quot;Good Cause Eviction,&quot; making it harder for landlords to remove tenants without legitimate reasons. Tenant power shaped housing law.</p></div></div><div class=&quot;relative group&quot;><div class=&quot;absolute -inset-1 bg-gradient-to-br from-rstu-red to-red-600 opacity-0 group-hover:opacity-5 rounded-lg transition-all duration-300 blur&quot;></div><div class=&quot;relative bg-white rounded-lg border-2 border-gray-100 group-hover:border-rstu-red p-8 transition-all duration-300&quot;><div class=&quot;inline-block mb-4 px-3 py-1 bg-rstu-red bg-opacity-10 text-rstu-red font-bold rounded-full text-sm&quot;>2019</div><div class=&quot;w-12 h-12 rounded-lg bg-rstu-red bg-opacity-10 flex items-center justify-center mb-4&quot;><svg class=&quot;w-6 h-6 text-rstu-red&quot; fill=none stroke=currentColor viewBox=&quot;0 0 24 24&quot;><path stroke-linecap=round stroke-linejoin=round stroke-width=1.5 d=&quot;M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12&quot;></path></svg></div><h3 class=&quot;text-xl font-black text-gray-900 mb-3&quot;>Oregon: No-Cause Evictions Banned</h3><p class=&quot;text-gray-700 leading-relaxed text-sm&quot;>Oregon eliminated evictions without cause, protecting tenants and requiring landlords to provide just cause. This happened because tenants fought for it.</p></div></div></div><div class=&quot;text-center p-8 bg-gradient-to-r from-rstu-red to-red-700 text-white rounded-lg&quot;><h3 class=&quot;text-2xl font-black mb-4&quot;>This Is Possible Here Too</h3><p class=&quot;text-lg leading-relaxed font-semibold&quot;>These wins didn't happen because politicians suddenly cared. They happened because tenants organized, refused to accept extraction, and built power to force change. That same power exists in Reno-Sparks.</p></div></div></section></div><div id=cta><section class=&quot;relative py-20 sm:py-28 px-4 bg-rstu-red text-white overflow-hidden&quot;><div class=&quot;absolute inset-0 opacity-10&quot;><svg class=&quot;w-full h-full&quot; viewBox=&quot;0 0 100 100&quot; preserveAspectRatio=none><defs><pattern id=dots width=20 height=20 patternUnits=userSpaceOnUse><circle cx=10 cy=10 r=2 fill=#ffffff></circle></pattern></defs><rect width=100 height=100 fill=url(#dots)></rect></svg></div><div class=&quot;relative z-10 max-w-4xl mx-auto text-center&quot;><h2 class=&quot;text-4xl sm:text-5xl lg:text-6xl font-black mb-8 leading-tight&quot;>Ready to Get Involved?</h2><p class=&quot;text-lg sm:text-xl mb-12 leading-relaxed max-w-2xl mx-auto font-semibold&quot;>Join tenant organizers in Reno-Sparks building collective power</p><button class=&quot;inline-block px-12 py-4 bg-white text-rstu-red font-black text-lg rounded-lg hover:bg-gray-100 transition-all duration-200 shadow-lg hover:shadow-xl transform hover:scale-105 mb-12&quot;>Enter RSTU Connect</button><div class=&quot;flex flex-col sm:flex-row justify-center gap-8 text-base font-semibold&quot;><button class=&quot;hover:underline transition-all&quot;>→ Explore the Library</button><button class=&quot;hover:underline transition-all&quot;>→ Find Your Building</button><button class=&quot;hover:underline transition-all&quot;>→ Organize In-Person</button></div></div></section></div></div></div></div><footer class=&quot;border-t border-gray-200 bg-white&quot;><div class=&quot;max-w-full px-4 sm:px-6 lg:px-8 py-6 text-center&quot;><p class=&quot;text-xs text-gray-500&quot;><a href=https://renosparkstenantsunion.org/ class=&quot;text-rstu-red hover:text-rstu-red-dark font-medium&quot;>RSTU Main Site</a> · <a href=https://docs.google.com/forms/d/e/1FAIpQLSc4Fgq0sW7BFHfFLDvM8NIUIKLtnkDTC9RwUQ1rLin8ZqyoSQ/viewform target=_blank rel=&quot;noopener noref
